import org.gradle.internal.os.OperatingSystem

// See client/build.gradle for why `com.moowork.node` is gone. Task names are unchanged — the
// root build depends on `:export-templates:target-identification:buildTemplate`.

def nodeVersion = "14.17.5"
def npm = OperatingSystem.current().isWindows() ? "npm.cmd" : "npm"

checkNodeVersion(nodeVersion)

def checkNodeVersion(required) {
    def stdout = new ByteArrayOutputStream()
    def result
    try {
        result = exec {
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
            commandLine "node", "-v"
        }
    } catch (Exception e) {
        throw new GradleException("Node.js v$required is required to build the export templates, " +
                "but `node` is not on PATH. See .devenv/README.md for the build environment.", e)
    }
    if (result.exitValue != 0) {
        throw new GradleException("Node.js v$required is required to build the export templates, " +
                "but `node -v` failed. See .devenv/README.md for the build environment.")
    }
    def installed = stdout.toString().trim()
    if (installed.replaceFirst(/^v/, "").tokenize(".")[0] != required.tokenize(".")[0]) {
        logger.warn("WARNING: building the export templates with Node $installed; it is pinned " +
                "to v$required.")
    }
}

task clean(type: Delete) {
    delete(project.buildDir)
}

task npmPrune(type: Exec) {
    commandLine npm, "prune"
}

task npmInstall(type: Exec) {
    dependsOn npmPrune
    commandLine npm, "install"
}

task buildTemplate(type: Exec) {
    dependsOn npmInstall
    commandLine npm, "run", "build"
}
