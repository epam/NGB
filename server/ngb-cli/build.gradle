import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
    id "org.sonarqube" version "6.0.1.5171"
    id "net.saliman.properties" version "1.5.2"
    id "java"
}

apply plugin: "java"
apply plugin: "application"

group "com.epam"

apply plugin: "checkstyle"
apply plugin: "pmd"
apply plugin: "jacoco"

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {

    // Logging
    implementation group: "org.slf4j", name: "slf4j-api", version: "2.0.9"
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: '2.24.3'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.24.3'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.24.3'

    // CLI parsing
    implementation group: 'args4j', name: 'args4j', version: '2.33'

    // HTTP handling
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.2.3'
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5-fluent', version: '5.2.3'
    implementation group: 'com.google.http-client', name: 'google-http-client-jackson2', version: '1.44.1'

    // Jackson
    implementation group: "com.fasterxml.jackson.core", name: "jackson-core", version: "2.16.1"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-databind", version: "2.16.1"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-annotations", version: "2.16.1"

    implementation group: 'commons-io', name: 'commons-io', version: '2.15.1'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.14.0'
    implementation group: 'commons-configuration', name: 'commons-configuration', version: '1.10'
    implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'

    // lombok
    compileOnly "org.projectlombok:lombok:1.18.36"
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // to find classes by annotation
    implementation group: 'io.github.lukehutch', name: 'fast-classpath-scanner', version: '2.0.9'

    testImplementation 'junit:junit:4.13.2'

    // http server mock
    testImplementation group: 'net.jadler', name: 'jadler-all', version: '1.3.0'
}

application {
    mainClass = "com.epam.ngb.cli.app.Application"
    applicationName = 'ngb'
}

task copyConfiguration {
    doLast {
        filterTokens.putAt("version", escape("$version"))
        copy {
            from('profiles/server.properties')
            into("$buildDir/resources/main/external")
            filter(ReplaceTokens, tokens: project.filterTokens)
        }
    }
}

processResources.dependsOn copyConfiguration

distZip {
    archiveVersion.set("")
}

distTar {
    compression = Compression.GZIP
    archiveVersion.set("")
    archiveExtension = 'tar.gz'
}

installDist {
    doLast {
        from("$destinationDir/ngb-cli-$version") {
            into "$destinationDir/ngb-cli"
        }
    }
}

distributions {
    main {
        distributionBaseName.set('ngb-cli')
        contents {
            def properties = file("$buildDir/resources/main/external")
            from(properties) {
                into "config"
            }
        }
    }
}

pmd {
    ruleSetFiles = files("config/pmd/pmd-ruleset.xml")
}

checkstyle {
    toolVersion = "7.2"
}

task regression(type: Exec) {
    executable 'bash'
    args 'script/regression_test.sh'
}

def escape(String s) {
    return s.replace("\\", "\\\\")
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(false)
    }
}
