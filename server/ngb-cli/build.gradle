import org.apache.tools.ant.filters.ReplaceTokens

apply plugin: "java"
apply plugin: 'application'

group "com.epam"

apply plugin: "checkstyle"
apply plugin: "pmd"
apply plugin: "jacoco"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    // 1.16.16 cannot run on any JDK past 8; see the note in server/catgenome/build.gradle.
    versionLombok = "1.18.46"

    // These three - and httpclient, commons-io and commons-lang3 below - are what the server module
    // resolves through the Spring Boot BOM. This module has no BOM over it, so they are kept in step
    // by hand: `./gradlew -p server/catgenome dependencies --configuration runtimeClasspath` is the
    // source of truth. Before migration Phase 9 they were slf4j 1.7.21, log4j 2.17.1 and jackson
    // 2.7.5 - 2016 vintage, with a 2021 Log4Shell patch on top.
    // log4j2 and jackson are ahead of the BOM's own managed versions on the server side too: both
    // are overridden there in an `ext['<name>.version']` block for the advisories listed in
    // .devenv/JAVA21-VULNERABILITY-REVIEW.md §4.1, so the numbers below are the overrides and not
    // what a stock Boot 3.5.16 would give you.
    versionSlf4j = "2.0.18"
    versionLog4j = "2.25.5"
    versionJackson = "2.21.5"
}

repositories  {
    mavenCentral()
}

dependencies {

    //Logging
    // slf4j 2.x, so log4j-slf4j2-impl and not log4j-slf4j-impl: the 1.7 binding implements the
    // StaticLoggerBinder contract that slf4j 2.0 removed, and pairing it with slf4j-api 2 leaves the
    // CLI logging to a NOP provider with "SLF4J: No SLF4J providers were found" on stderr.
    implementation group: "org.slf4j", name: "slf4j-api", version: "$versionSlf4j"
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j2-impl', version: "$versionLog4j"
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: "$versionLog4j"
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: "$versionLog4j"

    //CLI parsing
    implementation group: 'args4j', name: 'args4j', version: '2.33'

    //HTTP handling
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'
    implementation group: 'org.apache.httpcomponents', name: 'httpmime', version: '4.5.14'
    // com.google.http-client:google-http-client-jackson2:1.22.0 used to be here. Nothing in this
    // module has ever imported com.google.*, and it brought three jars (itself, google-http-client
    // 1.22.0 and jsr305 1.3.9) plus a request for httpclient 4.0.1 into the distribution. Deleted in
    // migration Phase 9 rather than bumped.

    // Jackson, through its own BOM. The three coordinates carried an explicit 2.7.5 each until
    // migration Phase 9; at 2.21 that no longer works, because jackson-annotations is released on the
    // minor line only - there is no jackson-annotations:2.21.4, just :2.21 - so a copied version
    // string fails to resolve. The BOM knows which is which.
    implementation platform("com.fasterxml.jackson:jackson-bom:$versionJackson")
    implementation group: "com.fasterxml.jackson.core", name: "jackson-core"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-databind"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-annotations"

    implementation group: 'commons-io', name: 'commons-io', version: '2.22.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.20.0'
    implementation group: 'commons-configuration', name: 'commons-configuration', version: '1.10'
    // The three CollectionUtils.isEmpty call sites here used commons-collections **3** until
    // migration Phase 8, and now use collections4, which is what the server module uses; the two
    // versions are kept in step by hand, there being no BOM over this module.
    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.6.0'
    // ...but collections 3 has to stay on the runtime classpath, and not because of NGB code:
    // commons-configuration 1.10 above declares commons-collections <optional>true</optional> while
    // XMLConfiguration.constructHierarchy uses CollectionUtils unconditionally. Since the declaration
    // is optional, nothing brings it transitively, so dropping this line makes every `ngb` invocation
    // die with NoClassDefFoundError in ConfigurationLoader.loadXmlConfiguration - i.e. before any
    // command runs. Verified by doing exactly that. It goes when commons-configuration 1.x is replaced
    // by commons-configuration2, which uses collections4 itself.
    runtimeOnly group: 'commons-collections', name: 'commons-collections', version: '3.2.2'

    // lombok
    compileOnly "org.projectlombok:lombok:$versionLombok"
    annotationProcessor "org.projectlombok:lombok:$versionLombok"
    testCompileOnly "org.projectlombok:lombok:$versionLombok"
    testAnnotationProcessor "org.projectlombok:lombok:$versionLombok"

    // To find the @Command handlers by annotation. Was io.github.lukehutch:fast-classpath-scanner:2.0.9
    // (2017) until migration Phase 8; that project was renamed to ClassGraph at 4.0 and the old
    // coordinate has had no release since. 2.0.9 did still work on 21 - it reads the classpath from the
    // launcher jar's manifest rather than from URLClassLoader - so this is a maintenance move, not a
    // fix. One jar: classgraph's only non-test dependency, io.github.toolfactory:narcissus, is optional.
    implementation group: 'io.github.classgraph', name: 'classgraph', version: '4.8.193'

    testImplementation 'junit:junit:4.13.2'

    //http server mock
    testImplementation group: 'net.jadler', name: 'jadler-all', version: '1.3.0'
}

application {
    mainClass = "com.epam.ngb.cli.app.Application"
}

// Token substitutions applied to profiles/server.properties. Used to come from the
// `net.saliman.properties` plugin, which is not Gradle-7-compatible; this map was the only
// thing the build took from it.
ext.filterTokens = [version: escape("$version")]

processResources {
    from('profiles/server.properties') {
        into "external"
        filter(ReplaceTokens, tokens: project.filterTokens)
    }
}

startScripts {
    applicationName = 'ngb'
}

// The distribution archives are named without a version; the root build's `buildCli` and the
// Docker image both look for a fixed `ngb-cli.tar.gz`. This used to be done by blanking
// project.version in a doFirst and renaming the file in a doLast.
//
// Blank the version rather than setting archiveFileName outright. The Distribution plugin derives
// the archive's *root directory* from these properties, and pinning archiveFileName made that root
// the whole file name - the tarball unpacked into a directory called `ngb-cli.tar.gz`, while
// docker/core/Dockerfile and docs/md/cli/installation.md both expect `ngb-cli/bin/ngb`.
// baseName + empty version gives the file names below and `ngb-cli/` inside them.
distZip {
    archiveBaseName = 'ngb-cli'
    archiveVersion = ''
}

distTar {
    compression = Compression.GZIP
    archiveBaseName = 'ngb-cli'
    archiveVersion = ''
    archiveExtension = 'tar.gz'
}

distributions {
    main {
        distributionBaseName = 'ngb-cli'
        contents {
            def properties = file("$buildDir/resources/main/external")
            from(properties) {
                into "config"
            }
        }
    }
}

pmd {
    toolVersion = "7.26.0"
    // See the note in server/catgenome/build.gradle: Gradle's default ruleSets is additive.
    ruleSets = []
    ruleSetFiles = files("config/pmd/pmd-ruleset.xml")
}

checkstyle {
    toolVersion = "11.1.0"
    // Gradle 4+ resolves the default config dir against the *root* project, which for this
    // multi-project build is the wrong place. Both modules keep their own copy.
    configDirectory = file("config/checkstyle")
}

def escape(String s) {
    return s.replace("\\", "\\\\")
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}
