import org.apache.tools.ant.filters.ReplaceTokens

apply plugin: "java"
apply plugin: 'application'

group "com.epam"

apply plugin: "checkstyle"
apply plugin: "pmd"
apply plugin: "jacoco"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

ext {
    // 1.16.16 cannot run on any JDK past 8; see the note in server/catgenome/build.gradle.
    versionLombok = "1.18.46"
}

repositories  {
    mavenCentral()
}

dependencies {

    //Logging
    implementation group: "org.slf4j", name: "slf4j-api", version: "1.7.21"
    implementation group: 'org.apache.logging.log4j', name: 'log4j-slf4j-impl', version: '2.17.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.17.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.17.1'

    //CLI parsing
    implementation group: 'args4j', name: 'args4j', version: '2.33'

    //HTTP handling
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.2'
    implementation group: 'org.apache.httpcomponents', name: 'httpmime', version: '4.5.2'
    implementation group: 'com.google.http-client', name: 'google-http-client-jackson2', version: '1.22.0'

    // Jackson
    implementation group: "com.fasterxml.jackson.core", name: "jackson-core", version: "2.7.5"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-databind", version: "2.7.5"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-annotations", version: "2.7.5"

    implementation group: 'commons-io', name: 'commons-io', version: '2.5'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.5'
    implementation group: 'commons-configuration', name: 'commons-configuration', version: '1.10'
    implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'

    // lombok
    compileOnly "org.projectlombok:lombok:$versionLombok"
    annotationProcessor "org.projectlombok:lombok:$versionLombok"
    testCompileOnly "org.projectlombok:lombok:$versionLombok"
    testAnnotationProcessor "org.projectlombok:lombok:$versionLombok"

    // to find classes by annotation. 2.0.9 predates JDK 9, but it reads the classpath from the
    // manifest of the launcher jar rather than from URLClassLoader, so CommandManager's scan
    // still finds every @Command handler on 17. Verified with `ngb version` off installDist.
    implementation group: 'io.github.lukehutch', name: 'fast-classpath-scanner', version: '2.0.9'

    testImplementation 'junit:junit:4.13.2'

    //http server mock
    testImplementation group: 'net.jadler', name: 'jadler-all', version: '1.3.0'
}

application {
    mainClass = "com.epam.ngb.cli.app.Application"
}

// Token substitutions applied to profiles/server.properties. Used to come from the
// `net.saliman.properties` plugin, which is not Gradle-7-compatible; this map was the only
// thing the build took from it.
ext.filterTokens = [version: escape("$version")]

processResources {
    from('profiles/server.properties') {
        into "external"
        filter(ReplaceTokens, tokens: project.filterTokens)
    }
}

startScripts {
    applicationName = 'ngb'
}

// The distribution archives are named without a version; the root build's `buildCli` and the
// Docker image both look for a fixed `ngb-cli.tar.gz`. This used to be done by blanking
// project.version in a doFirst and renaming the file in a doLast.
distZip {
    archiveFileName = 'ngb-cli.zip'
}

distTar {
    compression = Compression.GZIP
    archiveFileName = 'ngb-cli.tar.gz'
}

distributions {
    main {
        distributionBaseName = 'ngb-cli'
        contents {
            def properties = file("$buildDir/resources/main/external")
            from(properties) {
                into "config"
            }
        }
    }
}

pmd {
    ruleSetFiles = files("config/pmd/pmd-ruleset.xml")
}

checkstyle {
    toolVersion = "7.2"
    // Gradle 4+ resolves the default config dir against the *root* project, which for this
    // multi-project build is the wrong place. Both modules keep their own copy.
    configDirectory = file("config/checkstyle")
}

def escape(String s) {
    return s.replace("\\", "\\\\")
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}
