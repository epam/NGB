import de.undercouch.gradle.tasks.download.Download

plugins {
    id 'org.springframework.boot' version '3.5.16'
    // From Boot 2.x the dependency BOM is a separate plugin rather than part of the Boot one.
    id 'io.spring.dependency-management' version '1.1.7'
    id "de.undercouch.download" version "5.7.0"
}

group "com.epam"

// >>>>> building for different profiles
// >>>>> For configuration use -Pprofile=profile_name with run ('dev' is used by default)
loadConfiguration()

def loadConfiguration() {
    def profile = hasProperty("profile") ? profile : "dev"
    def database = hasProperty("database") ? database : "h2"
    def buildNumber =  hasProperty("buildNumber") ? buildNumber : ""
    project.ext.setProperty("profile", profile)
    project.ext.setProperty("database", database)
    project.ext.setProperty("buildNumber", buildNumber)
    apply plugin: "java"
}

// Token substitutions applied to the profile resources. This used to come from the
// `net.saliman.properties` plugin as `project.filterTokens`; the plugin is not
// Gradle-7-compatible and this map was the only thing the build used it for.
ext.filterTokens = [
        rootDirPath: escape(rootDir.absolutePath),
        version    : escape("$version")
]

apply from: "profiles.gradle"

// >>>>> applied plugins

apply plugin: "java"
apply plugin: "application"
apply plugin: "checkstyle"
apply plugin: "pmd"
apply plugin: "jacoco"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    // Per D13 the 129 JUnit 4 test classes are not converted; they run on the JUnit 5 platform
    // through the vintage engine, because Boot 3.5's spring-boot-starter-test is JUnit 5 only and
    // Gradle's JUnit 4 provider would leave the platform's own tests unrun.
    useJUnitPlatform()

    // The four --add-opens that used to be here are gone with EhCache 2 (D11): they existed only so
    // that its maxBytesLocalHeap sizing could walk the cached object graph with
    // Field.setAccessible, which JDK 16+ refuses for java.base. Caffeine bounds by entry count and
    // reflects on nothing. The same four went out of JAVA_REQUIRED_OPTS in
    // .devenv/ngb/entrypoint.sh at the same time.
    jvmArgs = ["-XX:MaxDirectMemorySize=7937m"]
}

// >>>>> defines external project properties, e.g. external dependencies versions
// Spring, Spring Security, Jackson, slf4j, JUnit, Mockito and Jetty are no longer listed here:
// the Boot 3.5.16 BOM manages all of them. Only libraries Boot does not know about keep a pin.
ext {
    versionJayWayJsonPath = "2.7.0"
    versionUnitils = "3.4.2"
    // 9.12.3, not 10.x. Both refuse a Lucene 6 index (Version.MIN_SUPPORTED_MAJOR is 8 and 9
    // respectively), so both cost the operator exactly one full reindex — but 10.x can read a 9.x
    // index, so bumping 9 -> 10 later is free. See "Phase 6 execution findings" in
    // .devenv/JAVA21-MIGRATION-PLAN.md. The Boot 3.5.16 BOM does not manage Lucene, so this pin
    // is ours to keep.
    versionLucene = "9.12.3"
    // 1.16.16 cannot run on any JDK past 8 (it reaches into com.sun.tools.javac internals that
    // JEP 396 closed). Lombok is a compile-time-only dependency, so the version is ours to pick
    // rather than the Boot BOM's.
    versionLombok = "1.18.46"
}

// >>>>> repositories that should be used to find any external dependencies
repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
    // Shibboleth's own repository, for OpenSAML. Phase 3 removed it on the assumption that the
    // Spring Security 6 SAML support resolves entirely from Central; it does not.
    // spring-security-saml2-service-provider 6.5.x depends on org.opensaml:opensaml-saml-{api,impl}
    // 4.3.2, and Central's org/opensaml/ directories stop at 4.0.1 — Shibboleth published 4.0.x to
    // Central and then went back to publishing only here. So the repository comes back for
    // OpenSAML 4, for a different reason than it was there for OpenSAML 2. Scoped by group so it
    // cannot shadow Central for anything else.
    maven {
        url "https://build.shibboleth.net/maven/releases/"
        content {
            includeGroup "org.opensaml"
            includeGroupByRegex "net\\.shibboleth.*"
        }
    }
    // org.sbgn:libsbgn:0.2 exists on no other repository — not Central, not Sonatype, not EBI —
    // and paxtools' sbgn-converter needs it transitively as well as directly. This repository
    // used to be declared as plain http, which Gradle 7 rejects; it serves https fine.
    maven {
        url "https://www.biopax.org/m2repo/releases/"
        content {
            includeGroup "org.sbgn"
        }
    }
}

configurations {
    all*.exclude module: 'spring-boot-starter-logging'
    all*.exclude group: 'ch.qos.logback'
    // Kept as a guard, not because anything declares it: NGB now takes logging from
    // spring-boot-starter-log4j2, whose slf4j binding is log4j-slf4j2-impl (slf4j 2.x). If some
    // transitive dependency dragged in the slf4j-1.x binding as well, both would register and slf4j
    // would pick one at random.
    all*.exclude module: 'log4j-slf4j-impl'
}

// >>>>> external dependencies used to compile and/or run application
dependencies {
    // >>>>> dependencies used to compile application and include into artifact
    // Spring Framework
    implementation group: "org.springframework", name: "spring-jdbc"
    implementation group: "org.springframework", name: "spring-context"
    implementation group: "org.springframework", name: "spring-context-support"
    implementation group: 'org.springframework', name: 'spring-aop'

    implementation group: "org.springframework.security", name: "spring-security-core"
    implementation group: "org.springframework.security", name: "spring-security-web"
    implementation group: "org.springframework.security", name: "spring-security-config"
    implementation group: 'org.springframework.security', name: 'spring-security-acl'

    // Replaces spring-security-saml2-core 1.0.10.RELEASE (the OpenSAML 2 extension), which Phase 3
    // removed: it was built on Spring Security 5's WebSecurityConfigurerAdapter/SAMLEntryPoint
    // filter model and on OpenSAML 2, neither of which exists in Spring Security 6, and OpenSAML 2
    // itself has been end-of-life since 2016. This is Spring Security's own SAML 2 service-provider
    // support, version-managed by the Boot BOM; it brings OpenSAML 4.3.2 from build.shibboleth.net
    // (see `repositories` above).
    implementation group: "org.springframework.security", name: "spring-security-saml2-service-provider"

    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    developmentOnly("org.springframework.boot:spring-boot-devtools")

    implementation('org.apache.tomcat.embed:tomcat-embed-jasper')
    implementation("org.springframework.boot:spring-boot-starter-tomcat")

    // Jackson
    implementation group: "com.fasterxml.jackson.core", name: "jackson-core"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-databind"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-annotations"
    implementation group: "com.fasterxml.jackson.dataformat", name: "jackson-dataformat-xml"
    implementation group: "com.squareup.retrofit2", name: "converter-jackson", version: "2.7.2"

    // JAXB left the JDK in Java 11, and ~288 imports here depend on it. Phase 2 stayed on the
    // `javax.xml.bind` package names because jakarta.xml.bind-api 2.3.x still *was* that package;
    // Boot 3.5 manages 4.0.x, where it is `jakarta.xml.bind`, so Phase 3 renamed the imports.
    implementation group: "jakarta.xml.bind", name: "jakarta.xml.bind-api"
    runtimeOnly group: "org.glassfish.jaxb", name: "jaxb-runtime"

    // ...and the javax JAXB stack stays as well, for three dependencies whose *own* class files are
    // annotated with javax.xml.bind: org.sbgn:libsbgn:0.2 (2011; its POM declares no dependencies at
    // all - it expected JAXB to be part of the JDK, as it was until Java 11), sbgn-converter, which
    // marshals through libsbgn, and biojava-structure. A jakarta JAXBContext cannot bind them: it
    // reads jakarta.xml.bind annotations only, so it sees those classes as unannotated POJOs. The two
    // stacks share no package and no service file, so they coexist; ours is jakarta, theirs is javax
    // (manager/pathway/PathwayManager.readFromFile, which builds the org.sbgn.bindings context by
    // hand, therefore keeps its javax imports). Both go when those libraries are updated or replaced.
    // The runtime is com.sun.xml.bind:jaxb-impl rather than org.glassfish.jaxb:jaxb-runtime:2.3.x
    // because the latter is the same group:artifact as the jakarta 4.x runtime above, and Gradle
    // resolves a group:artifact to one version.
    implementation group: "javax.xml.bind", name: "jaxb-api", version: "2.3.1"
    runtimeOnly group: "com.sun.xml.bind", name: "jaxb-impl", version: "2.3.9"

    // Jettison. Used directly by HttpDataManager, NCBIDataManager, PdbEntriesManager and
    // OpenTargetsManager; until Phase 1 it arrived transitively through hadoop-client, so the
    // version below is the one Hadoop 2.2.0 resolved. Superseded by a supported release when
    // the dependency set is refreshed.
    implementation group: "org.codehaus.jettison", name: "jettison", version: "1.1"

    // Apache Commons
    implementation group: "commons-io", name: "commons-io", version: "2.4"
    // commons-lang3 carried an explicit `version: "3.0"` (2011) until Phase 3; the BOM manages it, so
    // the pin is gone. It also had to go: 12 files imported commons-lang **2** (`org.apache.commons.lang`),
    // which was never declared here at all - it arrived transitively through the mangofactory Swagger
    // stack, and disappeared with it. Those imports moved to the lang3 equivalents (StringUtils,
    // ArrayUtils, time.DateUtils - same methods, same semantics); `lang.math.RandomUtils`, whose lang3
    // successor has a different signature set and is deprecated in current releases, became
    // ThreadLocalRandom in the two tests that used it, and `org.bouncycastle.util.Strings.toLowerCase`
    // - another accidental transitive, from OpenSAML - became Locale.ROOT lowercasing in GenePredUtils.
    implementation group: "org.apache.commons", name: "commons-lang3"
    implementation group: "org.apache.commons", name: "commons-collections4", version: "4.1"
    implementation group: "commons-validator", name: "commons-validator", version: "1.5.0"
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
    // Logging.
    // Until Phase 3 this was `org.apache.logging.log4j:log4j:2.17.1` (the aggregator POM) plus
    // slf4j-log4j12, i.e. slf4j bound to log4j *1.2.17*, with the log4j 2 artifacts sitting on the
    // classpath unused. slf4j-log4j12 does not exist for slf4j 2.x, which Boot 3 requires, so the
    // standard starter takes over: log4j-api + log4j-core + log4j-slf4j2-impl, versions from the BOM.
    // Consequence: the five log4j-1-format `log4j.xml` files were rewritten as log4j2.xml.
    implementation("org.springframework.boot:spring-boot-starter-log4j2")
    implementation group: "org.slf4j", name: "slf4j-api"
    // Samtools
    implementation group: "com.github.samtools", name: "htsjdk", version: "2.2.4"
    implementation "org.xerial.snappy:snappy-java:1.0.3-rc3"
    // API docs. springdoc replaces com.mangofactory:swagger-springmvc:1.0.2 (Swagger 1.x, dead since
    // 2015, and broken outright by Boot 2.6's PathPatternParser - see the Phase 2 findings) and the
    // org.webjars:swagger-ui:2.0.24 webjar, whose UI was also committed under src/main/resources and
    // src/main/webapp. springdoc ships its own UI in a jar; see config/OpenApiConfiguration.java.
    implementation group: "org.springdoc", name: "springdoc-openapi-starter-webmvc-ui", version: "2.8.17"
    // The 41 files carrying com.wordnik.swagger.annotations.* still compile against the old
    // annotation jar, on the compile classpath only. Annotation types that are missing at runtime are
    // silently skipped by Class.getDeclaredAnnotations(), so nothing reads them and nothing breaks;
    // keeping them compiling means Phase 8 can *translate* that documentation text into
    // io.swagger.v3.oas.annotations rather than rewrite it from nothing. Deleting the jar and the 41
    // files' worth of annotations is a Phase 8 step, not a Phase 3 one.
    compileOnly group: "com.wordnik", name: "swagger-annotations", version: "1.3.11"
    // H2 Database Engine & Connection pool.
    // h2, postgresql and flyway-core were pinned to 1.3.176 / 9.4-1206-jdbc4 / 3.2.1 until Phase 5
    // of the Java 21 migration; they now take the Boot 3.5.16 BOM's 2.3.232 / 42.7.11 / 11.7.2.
    // Three things that upgrade needed and that are easy to undo by accident:
    //   - H2 2.x made USER, VALUE and END reserved words, and this schema uses all three. The
    //     DataSource carries `SET NON_KEYWORDS END,USER,VALUE` as its connection-init SQL rather
    //     than the schema being renamed - see conf/catgenome/applicationContext-database.xml.
    //   - H2 2.x cannot open a 1.3 database file. Operators have to export and re-import; the
    //     procedure is docs/md/installation/database-upgrade.md.
    //   - Flyway 10 removed the setter API the XML bean used, and changed the checksum algorithm
    //     and the schema-history table shape. FlywayMigrator handles both.
    //
    // c3p0 0.9.5.1 is gone (D9): it was last released in 2015, and HikariCP is what Boot manages,
    // tests and supports. The version comes from the BOM. See
    // conf/catgenome/applicationContext-database.xml for the property-name mapping.
    implementation group: "com.zaxxer", name: "HikariCP"
    implementation group: "com.h2database", name: "h2"
    // aspectjweaver carries no version any more: 1.8.8 (2015) predates the class-file format of
    // every JDK past 8 and cannot weave Java 21 bytecode. The BOM's 1.9.x can.
    implementation group: "org.aspectj", name: "aspectjweaver"
    implementation group: 'org.postgresql', name: 'postgresql'
    // Flyway database migration to update embedded database when application starts.
    // From Flyway 10 the per-database support lives in its own artifact and flyway-core alone
    // fails with "no database found to handle jdbc:postgresql://...". H2 is the exception - it is
    // still inside flyway-core, so there is no flyway-database-h2 to add.
    implementation group: "org.flywaydb", name: "flyway-core"
    implementation group: "org.flywaydb", name: "flyway-database-postgresql"
    //Amazon s3
    // 1.11.704 (2020) cannot start under the Jackson that Boot 3.5 manages: EC2MetadataUtils' static
    // initialiser reads PropertyNamingStrategy.PASCAL_CASE_TO_CAMEL_CASE, a constant Jackson removed in
    // 2.12, and every NGB startup builds this client (Application.s3Client) - so the whole context
    // failed with NoSuchFieldError before a request was served. 1.12.797, the last v1 release, asks for
    // PropertyNamingStrategies.UPPER_CAMEL_CASE and falls back to the legacy constant on LinkageError,
    // so it works with either. Still SDK v1: D-table says v2, and that is a 6-file API rewrite that
    // belongs to the dependency-refresh phase, not to this one.
    implementation group: "com.amazonaws", name: "aws-java-sdk-s3", version: "1.12.797"
    implementation group: "com.amazonaws", name: "aws-java-sdk-sts", version: "1.12.797"

    // Azure Storage Blob
    implementation group: "com.azure", name: "azure-storage-blob", version: "12.14.0"
    implementation group: "com.azure", name: "azure-identity", version: "1.4.4"
    implementation group: 'io.projectreactor', name: 'reactor-core', version: '3.5.3'

    // Caching. EhCache 2.10.1 is gone (D11): Spring 6 removed org.springframework.cache.ehcache
    // outright, and EhCache 2's heap-size accounting needs --add-opens on java.base to reflect over
    // the cached object graph. Caffeine is what Spring Boot 3 supports out of the box; the version
    // comes from the BOM. Three places were on EhCache - conf/catgenome/applicationContext-cache.xml,
    // app/AclSecurityConfiguration and util/feature/reader/EhCacheBasedIndexCache - and
    // conf/catgenome/ehcache.xml is deleted with it.
    implementation group: "com.github.ben-manes.caffeine", name: "caffeine"
    // Lucene. Four artifacts, down from six:
    //   lucene-analyzers-common was renamed lucene-analysis-common in 9.0;
    //   lucene-grouping was never imported (`lucene.index.max.size.grouping` is NGB's own
    //     batching knob, not Lucene's GroupingSearch);
    //   lucene-backward-codecs is deliberately absent - it lets 9.x read an 8.x index, which
    //     nothing here has, and we *want* the older formats to be rejected so the D8 guard
    //     fires instead of a silent half-read. See app/LuceneIndexVersionCheck.
    implementation group: "org.apache.lucene", name:"lucene-core", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-queryparser", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-analysis-common", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-facet", version: versionLucene

    // Was com.auth0:java-jwt:3.1.0 (2016) until Phase 3 took the JWT stack out of the build; used by
    // security/jwt/{JwtTokenGenerator,JwtTokenVerifier} only. 4.x is a compatible upgrade for
    // everything those two call — the one semantic change is Claim.isNull(), see the Phase 4
    // findings in .devenv/JAVA21-MIGRATION-PLAN.md. Boot does not manage this artifact.
    implementation group: "com.auth0", name: "java-jwt", version: "4.6.0"

    // lombok
    compileOnly "org.projectlombok:lombok:$versionLombok"
    annotationProcessor "org.projectlombok:lombok:$versionLombok"
    testCompileOnly "org.projectlombok:lombok:$versionLombok"
    testAnnotationProcessor "org.projectlombok:lombok:$versionLombok"

    implementation(group: "org.jetbrains.bio", name: "big", version: "0.9.1") {
        exclude group: "com.github.samtools", module: "htsjdk"
    }

    // biojava
    implementation group: "org.biojava", name:"biojava-genome", version: "4.2.0"
    implementation group: "org.biojava", name:"biojava-structure", version: "4.2.0"

    // newick format
    implementation group: "com.github.qurben", name: "libnewicktree", version: "1.0"

    // igv
    implementation group: "com.github.igvteam", name: "igv", version: "v2.6.3"

    // sbgn format
    implementation group: "org.sbgn", name: "libsbgn", version: "0.2"

    //  BioPAX
    implementation group: "org.biopax.paxtools", name: "paxtools-core", version: "5.1.0"
    implementation group: "org.biopax.paxtools", name: "sbgn-converter", version: "5.0.0"
    implementation group: "pathwaycommons", name: "chilay-sbgn", version: "3.0.0"

    //LLM
    implementation group: "com.azure", name: "azure-ai-openai", version: "1.0.0-beta.2"
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'

    implementation group: 'com.google.apis', name: 'google-api-services-customsearch', version: 'v1-rev20240103-2.0.0'
    implementation group: 'com.google.http-client', name: 'google-http-client-jackson2', version: '1.44.1'

    //Excel
    implementation group: "org.apache.poi", name: "poi", version: "3.16"
    implementation group: "org.apache.poi", name: "poi-ooxml", version: "3.16"

//    CSV
    implementation group: "com.opencsv", name: "opencsv", version: "5.8"

    // >>>>> dependencies used to compile tests; in fact no need to include them into artifact
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    // spring-boot-starter-test dropped JUnit 4 in Boot 2.2 in favour of JUnit 5; all 129 test
    // classes here are JUnit 4, so it comes back as an explicit dependency rather than through the
    // starter, and the vintage engine runs it on the JUnit 5 platform (see `test` above, and D13).
    testImplementation group: "junit", name: "junit", version: "4.13.2"
    testRuntimeOnly group: "org.junit.vintage", name: "junit-vintage-engine"
    // Declared rather than left to Gradle to inject: Gradle 8 still adds the launcher implicitly but
    // warns that it will stop doing so, and the version is BOM-managed either way.
    testRuntimeOnly group: "org.junit.platform", name: "junit-platform-launcher"
    testImplementation group: "org.unitils", name: "unitils-core", version: project.ext.versionUnitils
    // Was javax.servlet:javax.servlet-api:3.1.0. Same role - the tests that fake an HTTP request
    // (MultipartFileSender, UrlTestingUtils, BamManagerTest) compile against the servlet API
    // directly - under the name and version Boot 3.5 manages.
    testImplementation group: "jakarta.servlet", name: "jakarta.servlet-api"
    testImplementation group: "com.jayway.jsonpath", name: "json-path", version: project.ext.versionJayWayJsonPath
    testImplementation group: "com.jayway.jsonpath", name: "json-path-assert", version: project.ext.versionJayWayJsonPath
    // Jetty 12 (what the BOM manages) split the servlet API off into org.eclipse.jetty.ee10 and
    // deleted the AbstractHandler that these tests' file servers were written against. jetty-server
    // alone no longer knows what a servlet is, so the EE10 servlet module comes too and the two
    // handlers are now plain HttpServlets - see controller/util/UrlTestingUtils.
    testImplementation group: 'org.eclipse.jetty', name: 'jetty-server'
    testImplementation group: 'org.eclipse.jetty.ee10', name: 'jetty-ee10-servlet'
    testImplementation group: "org.springframework.security", name: "spring-security-test"

    // javax.transaction:jta:1.1 went out with EhCache 2, which was the only thing that wanted it
    // (net.sf.ehcache.transaction refers to javax.transaction.* and EhCache's CacheManager touches
    // those classes while parsing a configuration). Nothing else in the tree imports
    // javax.transaction, and Spring 6 is on jakarta.transaction.
}

// io.spring.dependency-management applies the Boot BOM to *every* configuration, including the one
// Gradle assembles to run PMD. PMD 7 needs commons-lang3 >= 3.13 for
// EnumUtils.getEnumMap(Class, Function), and a BOM pinning it lower kills pmdMain with a
// NoSuchMethodError before it reads a source file. The analyser's classpath is not the
// application's, so keep the app's managed version off it. A resolution rule rather than a `pmd`
// dependency declaration: the Pmd plugin adds the tool itself through defaultDependencies, which
// only fires while the configuration has no declared dependencies at all.
configurations.pmd {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.apache.commons" && details.requested.name == "commons-lang3") {
            details.useVersion "3.20.0"
        }
    }
}

// >>>>> configuration for pmd plugin
pmd {
    toolVersion = "7.26.0"
    // ruleSetFiles does not replace ruleSets, it adds to it, and Gradle's default for ruleSets is
    // the entire category/java/errorprone.xml (it was the much narrower java-basic under Gradle 3).
    // Left at the default it contributes ~1690 violations from rules this project never asked for.
    ruleSets = []
    // One ruleset only. There used to be a second, pmd-ruleset-feature-index-manager.xml, which
    // re-declared the whole rule list with AvoidCatchingGenericException off and an include-pattern
    // for FeatureIndexManager.java and util/TestUtils.java. It could not have been doing that:
    // RuleSets.apply() runs the rule chain before it consults each ruleset's file patterns, and
    // nearly every PMD rule is rule-chain based, so the patterns were ignored and every shared rule
    // ran twice (116 reported violations for 58 actual ones). It is also no longer needed -
    // FeatureIndexManager only catches IOException now, and the one place that does still need the
    // exemption, util/TestUtils.assertFail, carries a @SuppressWarnings for that single rule. (Phase
    // 2 recorded that util/TestUtils.java was out of reach because it is under src/test; true of
    // pmdMain, but pmdTest scans it, and Phase 3 is where pmdTest was first run.)
    ruleSetFiles = files("config/pmd/pmd-ruleset.xml")
}

checkstyle {
    toolVersion = "11.1.0"
    // Gradle 4+ resolves the default config dir against the *root* project, which for this
    // multi-project build is the wrong place. Both modules keep their own copy.
    configDirectory = file("config/checkstyle")
}

def excludePattern = 'VgPb'
def excludePatternAntStyle = '**/' + excludePattern + '*'

tasks.withType(Checkstyle) {
    exclude excludePatternAntStyle
}
tasks.withType(Pmd) {
    exclude excludePatternAntStyle
}

def escape(String s) {
    return s.replace("\\", "\\\\")
}

// Packaging. Under Boot 1.5 `bootRepackage` rewrote the output of the plain `jar` task in place,
// so naming the `jar` task's archive was enough. Boot 2.x builds the executable jar in a separate
// `bootJar` task and leaves `jar` producing a thin `-plain.jar` alongside it — which the `zip`,
// `tar` and `bundle*` tasks below would happily pick up too, since they glob build/libs for
// `**/*.jar`. So name `bootJar` and turn the plain jar off.
bootJar {
    archiveFileName = "catgenome.jar"
}

jar {
    enabled = false
}

//Distributions
//distribution properties
def appName = 'ngb-server'
// Boot 3.2 relocated the loader classes into org.springframework.boot.loader.launch; the old name is
// not in the jar any more, so the generated ngb-server start scripts would fail with
// ClassNotFoundException. Only the zip/tar/bundle* distributions use this - none of them is wired
// into `assemble`, so nothing in .devenv builds them, but the name still has to be right.
def springBootlauncherClass = 'org.springframework.boot.loader.launch.JarLauncher'
def springBootJarName = 'catgenome.jar'
def ngbJvmOptions = ["-Xms512m", "-Xmx2g"]
def jreURL = "http://download.oracle.com/otn-pub/java/jdk/8-b132/"
def windowsJre = "jre-8-windows-x64.tar.gz"
def linuxJre = "jre-8-linux-x64.tar.gz"

startScripts {
    applicationName = appName
    mainClass = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
}

task zip(type: Zip) {
    dependsOn bootJar
    from('build/libs/') {
        include '**/*.jar'
        into('lib')
    }
    from('build/scripts') {
        into('bin')
    }
    archiveBaseName = appName
    archiveFileName = 'ngb-server.zip'
}

task tar(type: Tar) {
    dependsOn bootJar
    from('build/libs/') {
        include '**/*.jar'
        into('lib')
    }
    from('build/scripts') {
        into('bin')
    }
    archiveBaseName = appName
    archiveFileName = 'ngb-server.tgz'
    archiveExtension = 'tgz'
    compression = Compression.GZIP
}

//Windows Distribution
task customStartScriptsWin(type: CreateStartScripts) {
    applicationName = appName
    mainClass = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
    outputDir = file("$buildDir/scripts")
    doLast {
        windowsScript.text = windowsScript.text.replace("set JAVA_EXE=%JAVA_HOME%/bin/java.exe",
                "set JAVA_EXE=%APP_HOME%/jre1.8.0/bin/java.exe")
        unixScript.text = unixScript.text.replace("exec \"\$JAVACMD\" \"\$@\"",
                "exec \"\$APP_HOME/jre1.8.0/bin/java\" \"\$@\"")
    }
}

task downloadJreWin(type: Download) {
    dependsOn bootJar
    src jreURL + windowsJre
    dest "$buildDir/downloads/$windowsJre"
    header 'Cookie', 'oraclelicense=accept-securebackup-cookie'
    overwrite true
}

task bundleWindows(type: Zip) {
    dependsOn downloadJreWin
    dependsOn customStartScriptsWin, bootJar
    from(tarTree(resources.gzip("$buildDir/downloads/$windowsJre"))) {
    }

    from("$buildDir/downloads/jre1.8.0") {
    }

    from("$buildDir/libs") {
        include '**/*.jar'
        into('lib')
    }

    from("$buildDir/scripts") {
        into('bin')
    }

    archiveBaseName = appName
    archiveFileName = 'ngb-server-windows.zip'
}

