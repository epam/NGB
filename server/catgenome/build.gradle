import de.undercouch.gradle.tasks.download.Download
import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    repositories {
        mavenCentral()
    }

    dependencies {
        classpath "org.akhikhl.gretty:gretty:+"
    }
}

plugins {
    id "net.saliman.properties" version "1.4.4"
    id "org.sonarqube" version "6.0.1.5171"
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id "de.undercouch.download" version "3.1.2"
    id "com.github.ManifestClasspath" version "0.1.0-RELEASE"
    id "io.freefair.lombok" version "8.13"
    id "war"
}

group "com.epam"

// >>>>> building for different profiles
// >>>>> For configuration use -Pprofile=profile_name with run ('dev' is used by default)
loadConfiguration()

def loadConfiguration() {
    def profile = hasProperty("profile") ? profile : "dev"
    def database = hasProperty("database") ? database : "h2"
    def buildNumber = hasProperty("buildNumber") ? buildNumber : ""
    project.ext.setProperty("profile", profile)
    project.ext.setProperty("database", database)
    project.ext.setProperty("buildNumber", buildNumber)
    if (profile == "jar") {
        tasks.withType(War).all { it.enabled = false }
        bootJar {
            archiveFileName.set("catgenome.jar")
        }
    } else {
        bootWar {
            enabled = false
            apply plugin: "war"
            war {
                archiveFileName.set("catgenome.war")
            }
        }
    }
}

apply from: "profiles.gradle"

// >>>>> applied plugins
apply plugin: "java-library"
apply plugin: "application"
apply plugin: "checkstyle"
apply plugin: "pmd"
apply plugin: "jacoco"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    jvmArgs = ["-XX:MaxDirectMemorySize=7937m"]
}

// >>>>> defines external project properties, e.g. external dependencies versions
ext {
    versionSlf4j = "1.7.5"
    versionJackson = "2.16.1"
    versionSpring = "6.1.1"
    versionJayWayJsonPath = "2.7.0"
    versionSpringSecurity = "6.2.1"
    versionJUnit = "4.12"
    versionUnitils = "3.4.2"
    versionJavaXServlet = "3.1.0"
    versionMockito = "1.10.19"
    versionLucene = "6.6.0"
}

// >>>>> repositories that should be used to find any external dependencies
repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
    maven {
        url "https://www.biopax.org/m2repo/releases/"
    }
    maven {
        url "https://build.shibboleth.net/maven/releases/"
    }
    flatDir {
        dirs 'lib'  // Added 'libs' directory for local JARs
    }
}

// >>>>> external dependencies used to compile and/or run application
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // >>>>> dependencies used to compile application and include into artifact
    configurations {
        all {
            // Remove all conflicting logging implementations
            exclude group: 'ch.qos.logback', module: 'logback-classic'
            exclude group: 'org.slf4j', module: 'slf4j-simple'
            exclude group: 'org.slf4j', module: 'slf4j-log4j12'
            exclude group: 'org.slf4j', module: 'slf4j-reload4j'
            exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
            exclude group: 'commons-logging', module: 'commons-logging'
            exclude module: 'spring-boot-starter-logging'
            exclude group: 'javax.cache', module: 'cache-api'
            exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.72'
            // Force SLF4J 2.x versions to ensure compatibility
            force 'org.slf4j:slf4j-api:2.0.7'
            force 'org.slf4j:jcl-over-slf4j:2.0.7'
            force 'org.slf4j:jul-to-slf4j:2.0.7'
            force 'org.slf4j:log4j-over-slf4j:2.0.7'
        }
    }

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.springframework.security:spring-security-acl'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.security:spring-security-acl'
    implementation 'org.springframework.security:spring-security-saml2-service-provider'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    implementation "org.springframework.boot:spring-boot-starter-log4j2"
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'

    api("org.springframework.boot:spring-boot-devtools")

    implementation 'org.slf4j:jcl-over-slf4j:2.0.7'

    if (profile == "jar") {
        api('org.apache.tomcat.embed:tomcat-embed-jasper')
        api("org.springframework.boot:spring-boot-starter-tomcat")
    } else {
        providedCompile('org.apache.tomcat.embed:tomcat-embed-jasper')
        providedCompile("org.springframework.boot:spring-boot-starter-tomcat")
    }

    implementation 'org.bouncycastle:bcprov-jdk18on:1.72'

    // Jackson
    implementation group: "com.squareup.retrofit2", name: "converter-jackson", version: "3.0.0"

    // Apache Commons
    implementation group: "commons-io", name: "commons-io", version: "2.20.0"
    implementation group: "org.apache.commons", name: "commons-lang3", version: "3.18.0"
    implementation group: "org.apache.commons", name: "commons-collections4", version: "4.5.0"
    implementation group: "commons-validator", name: "commons-validator", version: "1.10.0"
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'

    // Local htsjdk dependency instead of Maven version
    implementation name: 'htsjdk'

    // Samtools
    implementation "org.xerial.snappy:snappy-java:1.0.3-rc3"
    // Removed: implementation group: "com.github.samtools", name: "htsjdk", version: "4.2.0"

    // Swagger
    implementation group:"org.springdoc", name:"springdoc-openapi-ui", version:"1.8.0"

    // H2 Database Engine & Connection pool
    implementation group: "com.mchange", name: "c3p0", version: "0.11.2"
    implementation group: "com.h2database", name: "h2", version: "2.3.232"
    implementation group: "org.aspectj", name: "aspectjweaver", version: "1.9.24"
    implementation group: 'org.postgresql', name: 'postgresql', version: "42.7.7"
    // Flyway database migration to update embedded database when application starts
    implementation group: "org.flywaydb", name: "flyway-core", version: "11.12.0"
    implementation group: "org.flywaydb", name: "flyway-database-postgresql", version: "11.12.0"
    //Amazon s3
    implementation group: "software.amazon.awssdk", name: "s3", version:"2.31.14"
    implementation group: "software.amazon.awssdk", name: "sts", version:"2.31.14"
    implementation group: "com.amazonaws", name: "aws-java-sdk-s3", version: "1.12.782"
    implementation group: "com.amazonaws", name: "aws-java-sdk-sts", version: "1.12.782"

    // Azure Storage Blob
    implementation group: "com.azure", name: "azure-storage-blob", version: "12.14.0"
    implementation group: "com.azure", name: "azure-identity", version: "1.4.4"
    implementation group: 'io.projectreactor', name: 'reactor-core', version: '3.5.3'

    implementation 'commons-fileupload:commons-fileupload:1.3.1'

    //Caffeine cache
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Lucene
    implementation group: "org.apache.lucene", name:"lucene-core", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-queryparser", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-analyzers-common", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-grouping", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-facet", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-backward-codecs", version: versionLucene

    //security
    implementation 'com.auth0:java-jwt:3.1.0'

    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'com.sun.xml.bind:jaxb-impl:2.3.4'

    // lombok
    compileOnly "org.projectlombok:lombok:1.18.36"
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    //hadoop
    implementation group: "org.apache.hadoop", name:"hadoop-client", version: "2.2.0"

    api(group: "org.jetbrains.bio", name: "big", version: "0.9.1") {
        exclude group: "com.github.samtools", module: "htsjdk"  // Exclude to avoid conflict with local htsjdk
    }

    // biojava
    implementation group: "org.biojava", name:"biojava-genome", version: "4.2.0"
    implementation group: "org.biojava", name:"biojava-structure", version: "4.2.0"

    // newick format
    implementation group: "com.github.qurben", name: "libnewicktree", version: "1.0"

    // igv
    implementation group: "com.github.igvteam", name: "igv", version: "v2.6.3"

    // sbgn format
    implementation group: "org.sbgn", name: "libsbgn", version: "0.2"

    //  BioPAX
    implementation group: "org.biopax.paxtools", name: "paxtools-core", version: "5.1.0"
    implementation group: "org.biopax.paxtools", name: "sbgn-converter", version: "5.0.0"
    implementation group: "pathwaycommons", name: "chilay-sbgn", version: "3.0.0"

    //LLM
    implementation group: "com.azure", name: "azure-ai-openai", version: "1.0.0-beta.2"
    implementation group: "com.google.cloud", name: "google-cloud-aiplatform", version: "3.37.0"
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.10.1'

    implementation group: 'com.google.apis', name: 'google-api-services-customsearch', version: 'v1-rev20240103-2.0.0'
    implementation group: 'com.google.http-client', name: 'google-http-client-jackson2', version: '1.44.1'

    //Excel
    implementation group: "org.apache.poi", name: "poi", version: "3.16"
    implementation group: "org.apache.poi", name: "poi-ooxml", version: "3.16"

    // CSV
    implementation group: "com.opencsv", name: "opencsv", version: "5.8"

    // test NG
    implementation group: "org.testng", name:"testng", version: "7.11.0"

    // >>>>> dependencies used to compile tests; in fact no need to include them into artifact
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation group: "org.unitils", name: "unitils-core", version: project.ext.versionUnitils
    testImplementation group: "javax.servlet", name: "javax.servlet-api", version: project.ext.versionJavaXServlet
    testImplementation group: "com.jayway.jsonpath", name: "json-path", version: project.ext.versionJayWayJsonPath
    testImplementation group: "com.jayway.jsonpath", name: "json-path-assert", version: project.ext.versionJayWayJsonPath
    testImplementation group: 'org.eclipse.jetty', name: 'jetty-server', version: '12.0.17'
    testImplementation group: "org.springframework.security", name: "spring-security-test", version: versionSpringSecurity

    testCompileOnly 'org.projectlombok:lombok:1.18.36'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
    testRuntimeOnly group: "javax.transaction", name: "jta", version: "1.1"
}

// >>>>> To configure Run/Debug with Local Tomcat on dev environment an exploded WAR archive should be
// >>>>> created. See also: https://issues.gradle.org/browse/GRADLE-1445
if (profile != "jar") {
    task warExploded(type: Sync) {
        into layout.buildDirectory.dir("catgenome").get().asFile
        with war
    }
    war.dependsOn warExploded
}

// >>>>> processes profiles
processResources.dependsOn copyConfiguration
processTestResources {
    filesNotMatching("**/templates/**") {
        filter(ReplaceTokens, tokens: project.filterTokens)
    }
}

// >>>>> configuration for pmd plugin
pmd {
    ruleSetFiles = files("config/pmd/pmd-ruleset.xml", "config/pmd/pmd-ruleset-feature-index-manager.xml")
}

checkstyle {
    toolVersion = "7.2"
}

def excludePattern = 'VgPb'
def excludePatternAntStyle = '**/' + excludePattern + '*'

tasks.withType(Checkstyle) {
    exclude excludePatternAntStyle
}
tasks.withType(Pmd) {
    exclude excludePatternAntStyle
}

def escape(String s) {
    return s.replace("\\", "\\\\")
}

//Distributions
//distribution properties
def appName = 'ngb-server'
def springBootlauncherClass = 'org.springframework.boot.loader.JarLauncher'
def springBootJarName = 'catgenome.jar'
def ngbJvmOptions = ["-Xms512m", "-Xmx2g"]
def jreURL = "https://download.oracle.com/java/21/archive/"
def windowsJre = "jdk-21.0.2_windows-x64_bin.zip"
def linuxJre = "jdk-21.0.2_linux-x64_bin.tar.gz"

startScripts {
    applicationName = appName
    mainClassName = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
}

task zip(type: Zip) {
    if (profile == "jar") {
        dependsOn bootJar
    } else {
        dependsOn bootWar
    }
    from('build/libs/') {
        include '**/*.jar'
        into('lib')
    }
    from('build/scripts') {
        into('bin')
    }
    archiveBaseName = 'ngb-server.zip'
}

task tar(type: Tar) {
    if (profile == "jar") {
        dependsOn bootJar
    } else {
        dependsOn bootWar
    }
    from('build/libs/') {
        include '**/*.jar'
        into('lib')
    }
    from('build/scripts') {
        into('bin')
    }
    archiveBaseName = 'ngb-server.tgz'
    archiveExtension = 'tgz'
    compression = Compression.GZIP
}

//Windows Distribution
task customStartScriptsWin(type: CreateStartScripts) {
    applicationName = appName
    mainClassName = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
    outputDir = file("$buildDir/scripts")
    doLast {
        windowsScript.text = windowsScript.text.replace("set JAVA_EXE=%JAVA_HOME%/bin/java.exe",
                "set JAVA_EXE=%APP_HOME%/jre1.8.0/bin/java.exe")
        unixScript.text = unixScript.text.replace("exec \"\$JAVACMD\" \"\$@\"",
                "exec \"\$APP_HOME/jre1.8.0/bin/java\" \"\$@\"")
    }
}

task downloadJreWin(type: Download) {
    if (profile == "jar") {
        dependsOn bootJar
    } else {
        dependsOn bootWar
    }
    src jreURL + windowsJre
    dest layout.buildDirectory.file("downloads/$windowsJre").get().asFile
    header 'Cookie', 'oraclelicense=accept-securebackup-cookie'
    overwrite true
}

task bundleWindows(type: Zip) {
    dependsOn downloadJreWin
    dependsOn customStartScriptsWin
    if (profile == "jar") {
        dependsOn bootJar
    } else {
        dependsOn bootWar
    }
    from(tarTree(resources.gzip(layout.buildDirectory.file("downloads/$windowsJre").get().asFile))) {
    }

    from(layout.buildDirectory.file("downloads/jre1.8.0").get().asFile) {
    }

    from(layout.buildDirectory.dir("libs").get().asFile) {
        include '**/*.jar'
        into('lib')
    }

    from(layout.buildDirectory.dir("scripts").get().asFile) {
        into('bin')
    }

    archiveBaseName = 'ngb-server-windows.zip'
}

//Linux Distribution
task customStartScriptsLinux (type: CreateStartScripts) {
    applicationName = appName
    mainClassName = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
    outputDir = file("$buildDir/scripts")
    doLast {
        unixScript.text = unixScript.text.replace("exec \"\$JAVACMD\" \"\$@\"",
                "exec \"\$APP_HOME/jre1.8.0/bin/java\" \"\$@\"")
    }
}

task downloadJreLinux(type: Download) {
    if (profile == "jar") {
        dependsOn bootJar
    } else {
        dependsOn bootWar
    }
    src jreURL + linuxJre
    dest layout.buildDirectory.file("downloads/$linuxJre").get().asFile
    header 'Cookie', 'oraclelicense=accept-securebackup-cookie'
    overwrite true
}

task bundleLinux(type: Tar) {
    dependsOn downloadJreLinux
    dependsOn customStartScriptsLinux, bootWar
    from (tarTree(resources.gzip(layout.buildDirectory.file("downloads/$linuxJre").get().asFile))) {
    }

    from(layout.buildDirectory.file("downloads/jre1.8.0").get().asFile) {
    }

    from(layout.buildDirectory.dir("libs").get().asFile) {
        include '**/*.jar'
        into('lib')
    }

    from(layout.buildDirectory.file("scripts/ngb-server").get().asFile) {
        into('bin')
    }

    archiveBaseName = 'ngb-server-linux.tgz'
    archiveExtension = 'tgz'
    compression = Compression.GZIP
}

distTar {
    enabled = false
}

distZip {
    enabled = false
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(false)
    }
}
