import de.undercouch.gradle.tasks.download.Download

plugins {
    id 'org.springframework.boot' version '3.5.16'
    // From Boot 2.x the dependency BOM is a separate plugin rather than part of the Boot one.
    id 'io.spring.dependency-management' version '1.1.7'
    id "de.undercouch.download" version "5.7.0"
}

group "com.epam"

// >>>>> building for different profiles
// >>>>> For configuration use -Pprofile=profile_name with run ('dev' is used by default)
loadConfiguration()

def loadConfiguration() {
    def profile = hasProperty("profile") ? profile : "dev"
    def database = hasProperty("database") ? database : "h2"
    def buildNumber =  hasProperty("buildNumber") ? buildNumber : ""
    project.ext.setProperty("profile", profile)
    project.ext.setProperty("database", database)
    project.ext.setProperty("buildNumber", buildNumber)
    apply plugin: "java"
}

// Token substitutions applied to the profile resources. This used to come from the
// `net.saliman.properties` plugin as `project.filterTokens`; the plugin is not
// Gradle-7-compatible and this map was the only thing the build used it for.
ext.filterTokens = [
        rootDirPath: escape(rootDir.absolutePath),
        version    : escape("$version")
]

apply from: "profiles.gradle"

// >>>>> applied plugins

apply plugin: "java"
apply plugin: "application"
apply plugin: "checkstyle"
apply plugin: "pmd"
apply plugin: "jacoco"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    // Per D13 the 129 JUnit 4 test classes are not converted; they run on the JUnit 5 platform
    // through the vintage engine, because Boot 3.5's spring-boot-starter-test is JUnit 5 only and
    // Gradle's JUnit 4 provider would leave the platform's own tests unrun.
    useJUnitPlatform()

    // The four --add-opens that used to be here are gone with EhCache 2 (D11): they existed only so
    // that its maxBytesLocalHeap sizing could walk the cached object graph with
    // Field.setAccessible, which JDK 16+ refuses for java.base. Caffeine bounds by entry count and
    // reflects on nothing. The same four went out of JAVA_REQUIRED_OPTS in
    // .devenv/ngb/entrypoint.sh at the same time.
    jvmArgs = ["-XX:MaxDirectMemorySize=7937m"]

    // -PexcludeNetworkTests drops the only two tests in the suite that reach the public internet,
    // and nothing else. They are the two long-standing baseline failures recorded in
    // .devenv/TEST-BASELINE.md: GffManagerTest.testLoadGenesTranscript fetches a GTF from Ensembl
    // over FTP-turned-HTTP, PdbDataManagerTest.testParse queries RCSB and flaps with its uptime.
    // CI (.github/workflows/build.yml) passes the flag so that a red run means a real regression;
    // a local `make test` does not, so the two stay visible to whoever is working here.
    //
    // Deliberately NOT excluded: BlatSearchManagerTest. It used to call UCSC too, but that was a
    // defect in the test - see "Two of the four baseline failures were not live-data failures at
    // all" in .devenv/JAVA21-MIGRATION-PLAN.md. It runs against its own fixture now, and if the
    // mock is ever unwired again CI is exactly where that should surface.
    if (project.hasProperty("excludeNetworkTests")) {
        filter {
            excludeTestsMatching "com.epam.catgenome.manager.GffManagerTest.testLoadGenesTranscript"
            excludeTestsMatching "com.epam.catgenome.manager.externaldb.PdbDataManagerTest.testParse"
        }
    }
}

// >>>>> defines external project properties, e.g. external dependencies versions
// Spring, Spring Security, Jackson, slf4j, JUnit, Mockito and Jetty are no longer listed here:
// the Boot 3.5.16 BOM manages all of them. Only libraries Boot does not know about keep a pin.
ext {
    versionJayWayJsonPath = "2.7.0"
    versionUnitils = "3.4.2"
    // 9.12.3, not 10.x. Both refuse a Lucene 6 index (Version.MIN_SUPPORTED_MAJOR is 8 and 9
    // respectively), so both cost the operator exactly one full reindex — but 10.x can read a 9.x
    // index, so bumping 9 -> 10 later is free. See "Phase 6 execution findings" in
    // .devenv/JAVA21-MIGRATION-PLAN.md. The Boot 3.5.16 BOM does not manage Lucene, so this pin
    // is ours to keep.
    versionLucene = "9.12.3"
    // 1.16.16 cannot run on any JDK past 8 (it reaches into com.sun.tools.javac internals that
    // JEP 396 closed). Lombok is a compile-time-only dependency, so the version is ours to pick
    // rather than the Boot BOM's.
    versionLombok = "1.18.46"
    // AWS SDK v2, migration Phase 8. The BOM is imported below rather than each artifact being
    // pinned: v2 is 477 co-released modules and mixing versions across them does not work.
    versionAwsSdk = "2.54.1"
    // The Azure SDK's own "client library" BOM, migration Phase 8, for the same reason as the AWS
    // one: azure-storage-blob and azure-identity share azure-core, azure-core-http-netty and
    // azure-json, those are co-released, and mixing versions across them is how you get a
    // NoSuchMethodError inside the SDK. 1.3.8 gives azure-storage-blob 12.35.0 (was 12.14.0, 2021)
    // and azure-identity 1.18.4 (was 1.4.4). It contains only com.azure artifacts, and only GA ones
    // - which is why azure-ai-openai, still beta-only, keeps its explicit version below.
    versionAzureSdk = "1.3.8"
}

// Overrides of versions the Boot 3.5.16 BOM manages, where the managed version carries an
// outstanding advisory. Each name is a property spring-boot-dependencies declares, so setting it
// here moves every artifact in that family at once (and, for netty/log4j2/jackson, the imported
// sub-BOM); a name that is *not* one of the BOM's properties fails silently, so each of these was
// checked against the resolved runtimeClasspath and not just against Boot's documentation. See
// .devenv/JAVA21-VULNERABILITY-REVIEW.md §4.1 for the advisories, and §7 for the resolved
// before/after. Note that ngb-cli has no BOM over it and repeats log4j2 and jackson by hand in its
// own `ext` block - it has to move in the same commit or it keeps the vulnerable versions.
ext['netty.version'] = '4.1.137.Final'          // 4.1.136 closes 11 of 12; CVE-2026-59903 needs .137
ext['log4j2.version'] = '2.25.5'                // also moves the log4j-bom this BOM imports
ext['jackson-bom.version'] = '2.21.5'
ext['commons-lang3.version'] = '3.20.0'
ext['postgresql.version'] = '42.7.12'           // the driver ships in both flavours, h2 included
// Undoes a downgrade rather than a bump: awssdk:apache5-client:2.54.1 asks for httpcore5 5.4.3 and
// httpclient5 5.6.4, and the BOM's older managed versions were winning (the dependency-management
// plugin resolves like Maven - managed beats a newer transitive request). httpcore5 5.3 -> 5.4 is a
// minor bump underneath Spring's HttpComponentsClientHttpRequestFactory, so it is the riskiest line
// in this group; `make verify-cloud` reads a track over s3:// and sws:// to exercise it.
ext['httpcore5.version'] = '5.4.3'              // carries httpcore5-h2 with it
ext['httpclient5.version'] = '5.6.4'

// The Boot BOM comes from the io.spring.dependency-management plugin; these add two more. Neither
// manages anything outside its own vendor's coordinates - the AWS one is 477 software.amazon.awssdk
// artifacts and the Azure one is 102 com.azure ones - so neither can move anything Boot manages
// (Jackson, slf4j, Netty and reactor-core in particular, which both SDKs depend on).
dependencyManagement {
    imports {
        mavenBom "software.amazon.awssdk:bom:$versionAwsSdk"
        mavenBom "com.azure:azure-sdk-bom:$versionAzureSdk"
    }
    // Bouncy Castle is the one library with an outstanding advisory that no BOM here manages, so it
    // cannot be moved by a property. It is nobody's declared dependency either: 1.72 arrives from
    // opensaml-security-api:4.3.2 (bcprov and bcpkix) and cryptacular:1.2.5 (bcprov 1.71), both
    // under spring-security-saml2-service-provider, so managing it is the way to move it without
    // adding a declaration for a library NGB does not call itself. 1.72 is from 2022 and carries
    // CVE-2025-14813 (the only new CRITICAL in the review) plus nine MEDIUMs; see §4.2.
    //
    // All three artifacts have to move together. bcpkix and bcutil are compiled against bcprov's
    // internals and are released in lockstep with it, so a 1.84 bcprov under a 1.72 bcpkix is a
    // NoSuchMethodError on the first signature - which for NGB is the SAML metadata/AuthnRequest
    // signing path, i.e. login. bcutil is included even though nothing declares it directly: it is
    // bcpkix's own dependency, and leaving it managed-but-unlisted is how the versions drift apart.
    dependencies {
        dependencySet(group: "org.bouncycastle", version: "1.84") {
            entry "bcprov-jdk18on"
            entry "bcpkix-jdk18on"
            entry "bcutil-jdk18on"
        }
        // 0.4 is from 2013 and has CVE-2024-36124 against it (§4.3). Not to be confused with
        // org.xerial.snappy:snappy-java, which htsjdk brings and which is a different project at a
        // current version - both are on the classpath. This one arrives under
        // org.jetbrains.bio:big:0.9.1, which is what reads BigWig/BigBed, and 0.5 is the last release
        // the project ever made, so this is as far as the coordinate goes.
        dependency "org.iq80.snappy:snappy:0.5"
    }
}

// >>>>> repositories that should be used to find any external dependencies
repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
    // Shibboleth's own repository, for OpenSAML. Phase 3 removed it on the assumption that the
    // Spring Security 6 SAML support resolves entirely from Central; it does not.
    // spring-security-saml2-service-provider 6.5.x depends on org.opensaml:opensaml-saml-{api,impl}
    // 4.3.2, and Central's org/opensaml/ directories stop at 4.0.1 — Shibboleth published 4.0.x to
    // Central and then went back to publishing only here. So the repository comes back for
    // OpenSAML 4, for a different reason than it was there for OpenSAML 2. Scoped by group so it
    // cannot shadow Central for anything else.
    maven {
        url "https://build.shibboleth.net/maven/releases/"
        content {
            includeGroup "org.opensaml"
            includeGroupByRegex "net\\.shibboleth.*"
        }
    }
    // org.sbgn:libsbgn:0.2 exists on no other repository — not Central, not Sonatype, not EBI —
    // and paxtools' sbgn-converter needs it transitively as well as directly. This repository
    // used to be declared as plain http, which Gradle 7 rejects; it serves https fine.
    maven {
        url "https://www.biopax.org/m2repo/releases/"
        content {
            includeGroup "org.sbgn"
        }
    }
}

configurations {
    all*.exclude module: 'spring-boot-starter-logging'
    all*.exclude group: 'ch.qos.logback'
    // Kept as a guard, not because anything declares it: NGB now takes logging from
    // spring-boot-starter-log4j2, whose slf4j binding is log4j-slf4j2-impl (slf4j 2.x). If some
    // transitive dependency dragged in the slf4j-1.x binding as well, both would register and slf4j
    // would pick one at random.
    all*.exclude module: 'log4j-slf4j-impl'
    // log4j **1**.2.17, end-of-life since 2015 and carrying seven advisories (three of them
    // CRITICAL: CVE-2019-17571, CVE-2022-23305, CVE-2022-23307 - see
    // .devenv/JAVA21-VULNERABILITY-REVIEW.md §4.3). Nothing here declares it; it arrives from
    // com.indeed:util-mmap:1.0.35, under org.jetbrains.bio:big:0.9.1, and it is the only jar on the
    // classpath that provides org.apache.log4j.*. Two libraries need those classes to exist -
    // util-mmap on the BigWig/BigBed read path and com.github.igvteam:igv:v2.6.3 on the GenePred
    // one, the latter with no declared log4j dependency of its own - so this exclusion is only safe
    // paired with the log4j-1.2-api bridge declared below, which reimplements the same package on
    // top of log4j 2. Excluding it on its own is a NoClassDefFoundError the first time either path
    // is taken.
    all*.exclude group: 'log4j', module: 'log4j'
}

// >>>>> external dependencies used to compile and/or run application
dependencies {
    // >>>>> dependencies used to compile application and include into artifact
    // Spring Framework
    implementation group: "org.springframework", name: "spring-jdbc"
    implementation group: "org.springframework", name: "spring-context"
    implementation group: "org.springframework", name: "spring-context-support"
    implementation group: 'org.springframework', name: 'spring-aop'

    implementation group: "org.springframework.security", name: "spring-security-core"
    implementation group: "org.springframework.security", name: "spring-security-web"
    implementation group: "org.springframework.security", name: "spring-security-config"
    implementation group: 'org.springframework.security', name: 'spring-security-acl'

    // Replaces spring-security-saml2-core 1.0.10.RELEASE (the OpenSAML 2 extension), which Phase 3
    // removed: it was built on Spring Security 5's WebSecurityConfigurerAdapter/SAMLEntryPoint
    // filter model and on OpenSAML 2, neither of which exists in Spring Security 6, and OpenSAML 2
    // itself has been end-of-life since 2016. This is Spring Security's own SAML 2 service-provider
    // support, version-managed by the Boot BOM; it brings OpenSAML 4.3.2 from build.shibboleth.net
    // (see `repositories` above).
    implementation group: "org.springframework.security", name: "spring-security-saml2-service-provider"

    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    developmentOnly("org.springframework.boot:spring-boot-devtools")

    implementation('org.apache.tomcat.embed:tomcat-embed-jasper')
    implementation("org.springframework.boot:spring-boot-starter-tomcat")

    // Jackson
    implementation group: "com.fasterxml.jackson.core", name: "jackson-core"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-databind"
    implementation group: "com.fasterxml.jackson.core", name: "jackson-annotations"
    implementation group: "com.fasterxml.jackson.dataformat", name: "jackson-dataformat-xml"
    // Retrofit is declared only through its Jackson converter; the core artifact and OkHttp come with
    // it. 2.7.2 (2020) until Phase 8, now 3.0.0, which is what moves OkHttp - the reason for the bump.
    // 2.7.2 pins okhttp 3.14.7 and okio 1.17.2, i.e. CVE-2021-0341 (hostname verification) and
    // CVE-2023-3635 (okio GzipSource); 3.0.0 asks for okhttp 4.12.0 and okio 3.x, which fix both.
    // Retrofit's own surface is unchanged for NGB - retrofit2.Call/Response, the retrofit2.http
    // annotations, Retrofit.Builder and JacksonConverterFactory.create are all as they were.
    implementation group: "com.squareup.retrofit2", name: "converter-jackson", version: "3.0.0"

    // JAXB left the JDK in Java 11, and ~288 imports here depend on it. Phase 2 stayed on the
    // `javax.xml.bind` package names because jakarta.xml.bind-api 2.3.x still *was* that package;
    // Boot 3.5 manages 4.0.x, where it is `jakarta.xml.bind`, so Phase 3 renamed the imports.
    implementation group: "jakarta.xml.bind", name: "jakarta.xml.bind-api"
    runtimeOnly group: "org.glassfish.jaxb", name: "jaxb-runtime"

    // ...and the javax JAXB stack stays as well, for the dependencies whose *own* class files are
    // annotated with javax.xml.bind: org.sbgn:libsbgn:0.2 (2011; its POM declares no dependencies at
    // all - it expected JAXB to be part of the JDK, as it was until Java 11) and sbgn-converter, which
    // marshals through libsbgn. (Phase 3 counted biojava-structure here too; Phase 8 removed that
    // dependency, so only the two SBGN ones are left, and both are frozen by decision D6.) A jakarta
    // JAXBContext cannot bind them: it reads jakarta.xml.bind annotations only, so it sees those
    // classes as unannotated POJOs. The two
    // stacks share no package and no service file, so they coexist; ours is jakarta, theirs is javax
    // (manager/pathway/PathwayManager.readFromFile, which builds the org.sbgn.bindings context by
    // hand, therefore keeps its javax imports). Both go when those libraries are updated or replaced.
    // The runtime is com.sun.xml.bind:jaxb-impl rather than org.glassfish.jaxb:jaxb-runtime:2.3.x
    // because the latter is the same group:artifact as the jakarta 4.x runtime above, and Gradle
    // resolves a group:artifact to one version.
    implementation group: "javax.xml.bind", name: "jaxb-api", version: "2.3.1"
    runtimeOnly group: "com.sun.xml.bind", name: "jaxb-impl", version: "2.3.9"

    // Jettison. Used directly by HttpDataManager, NCBIDataManager, PdbEntriesManager and
    // OpenTargetsManager - all four only for `new JSONObject(String)` over an external service's
    // response. Until Phase 1 it arrived transitively through hadoop-client, so it sat at the version
    // Hadoop 2.2.0 resolved, 1.1 (2009); Phase 8 moved it to the current release. 1.1 is affected by
    // the 2022-23 unbounded-recursion/allocation reports (CVE-2022-40149/40150, CVE-2022-45685/45693,
    // CVE-2023-1436), all of which are parser-side and so on exactly the path NGB uses. The fix that
    // closes them caps parse nesting at 500 levels by default (JSONObject.setGlobalRecursionDepthLimit
    // changes it); NCBI, RCSB and Open Targets replies nest an order of magnitude less than that.
    // 1.5.7 has no compile or runtime dependencies of its own - 1.1 pulled stax-api.
    implementation group: "org.codehaus.jettison", name: "jettison", version: "1.5.7"

    // Apache Commons
    // 2.4 (2012) until Phase 7, then exactly 2.15.1 - the version commons-compress 1.26.0 (which
    // htsjdk 5 brings, and which is the first commons-compress to depend on commons-io at compile
    // scope) asks for, held there because 2.16.0 deprecates
    // org.apache.commons.io.input.CountingInputStream. Phase 8 removed that usage - the counting
    // moved into FeatureSeekableStream itself, see its javadoc - so the pin is free to move again.
    // It still has to stay at or above what commons-compress asks for, or commons-compress hits
    // NoClassDefFoundError on the CRAM bzip2/lzma paths. (commons-compress itself resolves to 1.28.0
    // since the POI bump below - POI asks for a newer one than htsjdk does - and 1.28.0 wants
    // commons-io 2.20.0, so 2.22.0 clears it.)
    implementation group: "commons-io", name: "commons-io", version: "2.22.0"
    // commons-lang3 carried an explicit `version: "3.0"` (2011) until Phase 3; the BOM manages it, so
    // the pin is gone. It also had to go: 12 files imported commons-lang **2** (`org.apache.commons.lang`),
    // which was never declared here at all - it arrived transitively through the mangofactory Swagger
    // stack, and disappeared with it. Those imports moved to the lang3 equivalents (StringUtils,
    // ArrayUtils, time.DateUtils - same methods, same semantics); `lang.math.RandomUtils`, whose lang3
    // successor has a different signature set and is deprecated in current releases, became
    // ThreadLocalRandom in the two tests that used it, and `org.bouncycastle.util.Strings.toLowerCase`
    // - another accidental transitive, from OpenSAML - became Locale.ROOT lowercasing in GenePredUtils.
    implementation group: "org.apache.commons", name: "commons-lang3"
    // 4.1 (2015) until Phase 8. Bumped with POI rather than with the rest of the version backlog
    // because POI 5.5.1 asks for 4.5.0, and the io.spring.dependency-management plugin resolves like
    // Maven - a version declared here wins over a transitive request even when the transitive one is
    // newer - so leaving 4.1 in place would have quietly run POI against a library four minor
    // versions older than it was built against. Only CollectionUtils/ListUtils/MapUtils/SetUtils are
    // used here, all unchanged.
    // Six files here (and three in ngb-cli) imported CollectionUtils from commons-collections **3**
    // instead, which was never declared in either module - it arrives transitively under
    // commons-validator and opencsv. Phase 8 moved them all to collections4; isEmpty/isNotEmpty/union
    // are the only methods involved and behave identically.
    implementation group: "org.apache.commons", name: "commons-collections4", version: "4.6.0"
    // Deliberately NOT bumped in Phase 8, and the one dependency here that is knowingly left behind.
    // The only usage is UrlShorterManager's `new UrlValidator(ALLOW_LOCAL_URLS)`, which gates what
    // POST /generateShortUrl will store - and what GET /navigate?alias= then 301-redirects to.
    // 1.7 tightened the query-string charset to what RFC 3986 actually allows, so from 1.7 on
    // { } " | ^ \ < > and space are rejected unencoded ([ and ] still pass). NGB generates URLs that
    // contain them: BiologicalDataItemManager.generateUrl substitutes raw Jackson JSON into
    // `?tracks=`, and `ngb url --alias` posts exactly that string to the shortener, so every aliased
    // CLI URL - and the hand-written embedding URLs in docs/md/user-guide/embedding-url.md - would
    // start failing with "Invalid url format". The fix is to percent-encode the query value at the
    // point it is built, which changes a documented URL format and belongs with the client, not in a
    // dependency bump; see the Phase 8 findings in .devenv/JAVA21-MIGRATION-PLAN.md. No CVE is
    // outstanding against 1.5.0, and its commons-beanutils 1.9.2 request is overridden to 1.11.0 by
    // opencsv below.
    implementation group: "commons-validator", name: "commons-validator", version: "1.5.0"
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
    // Logging.
    // Until Phase 3 this was `org.apache.logging.log4j:log4j:2.17.1` (the aggregator POM) plus
    // slf4j-log4j12, i.e. slf4j bound to log4j *1.2.17*, with the log4j 2 artifacts sitting on the
    // classpath unused. slf4j-log4j12 does not exist for slf4j 2.x, which Boot 3 requires, so the
    // standard starter takes over: log4j-api + log4j-core + log4j-slf4j2-impl, versions from the BOM.
    // Consequence: the five log4j-1-format `log4j.xml` files were rewritten as log4j2.xml.
    implementation("org.springframework.boot:spring-boot-starter-log4j2")
    implementation group: "org.slf4j", name: "slf4j-api"
    // The org.apache.log4j.* package, reimplemented on top of log4j 2, for the two libraries that
    // still compile against log4j 1: com.indeed:util-mmap (BigWig/BigBed) and
    // com.github.igvteam:igv (GenePred). It replaces the log4j 1.2.17 jar excluded above - see the
    // note there - so their Logger calls now go through the same configuration as everything else
    // instead of into an unconfigured second logging framework. No version: spring-boot-dependencies
    // imports log4j-bom at ${log4j2.version}, so this follows the override at the top of the file.
    implementation group: "org.apache.logging.log4j", name: "log4j-1.2-api"
    // Samtools. 5.0.0 (was 2.2.4, 2016) - migration Phase 7, which also deleted the fork of four
    // htsjdk reader classes that used to live in util/feature/reader. 5.0.0 needs Java 17+ (class
    // file 61) and drops SRA support, which is the only thing it removes that 4.x had; NGB imports
    // none of it, and dropping it takes ngs-java and nashorn-core off the classpath with it.
    // snappy-java is no longer pinned here: the 1.0.3-rc3 pin was from 2011 and had no arm64
    // native. htsjdk manages 1.1.10.5, which does.
    implementation group: "com.github.samtools", name: "htsjdk", version: "5.0.0"
    // API docs. springdoc replaces com.mangofactory:swagger-springmvc:1.0.2 (Swagger 1.x, dead since
    // 2015, and broken outright by Boot 2.6's PathPatternParser - see the Phase 2 findings) and the
    // org.webjars:swagger-ui:2.0.24 webjar, whose UI was also committed under src/main/resources and
    // src/main/webapp. springdoc ships its own UI in a jar; see config/OpenApiConfiguration.java.
    implementation group: "org.springdoc", name: "springdoc-openapi-starter-webmvc-ui", version: "2.8.17"
    // No swagger-annotations declaration is needed: springdoc-openapi-starter-common brings
    // io.swagger.core.v3:swagger-annotations-jakarta (2.2.47), which is the jar the controllers'
    // io.swagger.v3.oas.annotations imports resolve against. Phase 3 left 41 files on
    // com.wordnik:swagger-annotations:1.3.11 as compileOnly - unread at runtime, but preserving the
    // documentation text for Phase 8 to translate; Phase 8 translated it and dropped the jar.
    // H2 Database Engine & Connection pool.
    // h2, postgresql and flyway-core were pinned to 1.3.176 / 9.4-1206-jdbc4 / 3.2.1 until Phase 5
    // of the Java 21 migration; they now take the Boot 3.5.16 BOM's 2.3.232 / 42.7.11 / 11.7.2.
    // Three things that upgrade needed and that are easy to undo by accident:
    //   - H2 2.x made USER, VALUE and END reserved words, and this schema uses all three. The
    //     DataSource carries `SET NON_KEYWORDS END,USER,VALUE` as its connection-init SQL rather
    //     than the schema being renamed - see conf/catgenome/applicationContext-database.xml.
    //   - H2 2.x cannot open a 1.3 database file. Operators have to export and re-import; the
    //     procedure is docs/md/installation/database-upgrade.md.
    //   - Flyway 10 removed the setter API the XML bean used, and changed the checksum algorithm
    //     and the schema-history table shape. FlywayMigrator handles both.
    //
    // c3p0 0.9.5.1 is gone (D9): it was last released in 2015, and HikariCP is what Boot manages,
    // tests and supports. The version comes from the BOM. See
    // conf/catgenome/applicationContext-database.xml for the property-name mapping.
    implementation group: "com.zaxxer", name: "HikariCP"
    implementation group: "com.h2database", name: "h2"
    // aspectjweaver carries no version any more: 1.8.8 (2015) predates the class-file format of
    // every JDK past 8 and cannot weave Java 21 bytecode. The BOM's 1.9.x can.
    implementation group: "org.aspectj", name: "aspectjweaver"
    implementation group: 'org.postgresql', name: 'postgresql'
    // Flyway database migration to update embedded database when application starts.
    // From Flyway 10 the per-database support lives in its own artifact and flyway-core alone
    // fails with "no database found to handle jdbc:postgresql://...". H2 is the exception - it is
    // still inside flyway-core, so there is no flyway-database-h2 to add.
    implementation group: "org.flywaydb", name: "flyway-core"
    implementation group: "org.flywaydb", name: "flyway-database-postgresql"
    //Amazon s3
    // SDK v2 since Phase 8; it was aws-java-sdk-s3/-sts 1.12.797, the last v1 release, and v1 went
    // end-of-support in December 2025. Three things to know about the v2 dependency shape:
    //   - the HTTP client is not bundled into the SDK core, but every v2 service module inherits
    //     apache5-client and netty-nio-client at runtime scope from its `services` parent POM, so
    //     both arrive with s3 whether or not they are asked for. apache5-client is declared here as
    //     well, to say out loud which transport the sync client uses - it is also the one the SDK
    //     would pick anyway (ClasspathSdkHttpServiceProvider ranks Apache5 above Apache above
    //     UrlConnection). Note it is httpclient*5*: the httpclient 4.5 that v1 used to put on the
    //     classpath, and that 16 files still import as org.apache.http.*, now comes from opensaml
    //     and google-http-client instead.
    //   - netty-nio-client is excluded. It is the async transport, nothing here builds an async
    //     client, and the adapter is dead weight. It is not what puts Netty in the fat jar - the
    //     Azure SDK does that, through azure-core-http-netty and reactor-netty.
    //   - sts is not imported by any NGB code, and neither was aws-java-sdk-sts: it is what the
    //     default credential chain needs to honour a `role_arn` profile or an EKS web-identity
    //     token, so it is runtime-only.
    //   - the s3 POM declares org.mockito:mockito-junit-jupiter at *compile* scope (an upstream
    //     packaging slip, still there in 2.54.1); a mocking framework has no business on the
    //     server's runtime classpath.
    implementation(group: "software.amazon.awssdk", name: "s3") {
        exclude group: "org.mockito"
        exclude group: "software.amazon.awssdk", module: "netty-nio-client"
    }
    implementation group: "software.amazon.awssdk", name: "apache5-client"
    runtimeOnly(group: "software.amazon.awssdk", name: "sts") {
        exclude group: "org.mockito"
        exclude group: "software.amazon.awssdk", module: "netty-nio-client"
    }

    // Azure Storage Blob. Versions come from the azure-sdk-bom imported above, not from here.
    // NGB's whole Azure surface is util/azure/AzureBlobClient and AzureBlobSeekableStream:
    // BlobServiceClientBuilder with one of three credential shapes (shared key, client secret,
    // DefaultAzureCredential), then getBlobClient().openInputStream(BlobRange, null), exists(),
    // getProperties().getBlobSize() and generateSas(BlobServiceSasSignatureValues). All of it is
    // unchanged between 12.14.0 and 12.35.0.
    implementation group: "com.azure", name: "azure-storage-blob"
    implementation group: "com.azure", name: "azure-identity"
    // io.projectreactor:reactor-core is deliberately NOT declared here. It was pinned in 2021 (at
    // 3.4.11, later 3.5.3) when the Azure SDK was moved from com.microsoft.azure to com.azure, to
    // force a reactor newer than azure-core asked for. Since Phase 3 the Boot BOM manages reactor at
    // 3.7.19, so the pin had inverted into a *downgrade*: this build script's declared version beats
    // a newer transitive request, because io.spring.dependency-management resolves the Maven way.

    // Caching. EhCache 2.10.1 is gone (D11): Spring 6 removed org.springframework.cache.ehcache
    // outright, and EhCache 2's heap-size accounting needs --add-opens on java.base to reflect over
    // the cached object graph. Caffeine is what Spring Boot 3 supports out of the box; the version
    // comes from the BOM. Three places were on EhCache - conf/catgenome/applicationContext-cache.xml,
    // app/AclSecurityConfiguration and util/feature/reader/EhCacheBasedIndexCache - and
    // conf/catgenome/ehcache.xml is deleted with it.
    implementation group: "com.github.ben-manes.caffeine", name: "caffeine"
    // Lucene. Four artifacts, down from six:
    //   lucene-analyzers-common was renamed lucene-analysis-common in 9.0;
    //   lucene-grouping was never imported (`lucene.index.max.size.grouping` is NGB's own
    //     batching knob, not Lucene's GroupingSearch);
    //   lucene-backward-codecs is deliberately absent - it lets 9.x read an 8.x index, which
    //     nothing here has, and we *want* the older formats to be rejected so the D8 guard
    //     fires instead of a silent half-read. See app/LuceneIndexVersionCheck.
    implementation group: "org.apache.lucene", name:"lucene-core", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-queryparser", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-analysis-common", version: versionLucene
    implementation group: "org.apache.lucene", name:"lucene-facet", version: versionLucene

    // Was com.auth0:java-jwt:3.1.0 (2016) until Phase 3 took the JWT stack out of the build; used by
    // security/jwt/{JwtTokenGenerator,JwtTokenVerifier} only. 4.x is a compatible upgrade for
    // everything those two call — the one semantic change is Claim.isNull(), see the Phase 4
    // findings in .devenv/JAVA21-MIGRATION-PLAN.md. Boot does not manage this artifact.
    implementation group: "com.auth0", name: "java-jwt", version: "4.6.0"

    // lombok
    compileOnly "org.projectlombok:lombok:$versionLombok"
    annotationProcessor "org.projectlombok:lombok:$versionLombok"
    testCompileOnly "org.projectlombok:lombok:$versionLombok"
    testAnnotationProcessor "org.projectlombok:lombok:$versionLombok"

    implementation(group: "org.jetbrains.bio", name: "big", version: "0.9.1") {
        exclude group: "com.github.samtools", module: "htsjdk"
    }

    // biojava. 4.2.0 (2016) until Phase 8. Only two packages are used: org.biojava.nbio.core.sequence
    // (the Genbank reader/writer trio in manager/genbank and one DNASequence in ReferenceManager) and
    // org.biojava.nbio.genome.parsers.gff (GenbankManager's Location, and GFF3Reader in
    // GenePredManagerTest). biojava-structure was declared here too and imported nowhere at all -
    // NGB stores PDB files and lets the client render them - so it is gone rather than bumped.
    // The forester exclusion is a packaging defect upstream, not a choice: biojava-alignment depends
    // on org.biojava.thirdparty:forester, whose POM has never been resolvable. 1.038 declared
    // openchart with a relative systemPath, which made every Gradle invocation print "Errors occurred
    // while building effective model"; 1.039 declares openchart:openchart:1.4.2 as an ordinary
    // dependency, which is published nowhere, and that is a hard resolution failure. Excluding it
    // removes the warning as well as the failure. NGB did reach into forester, but for one thing only:
    // HeatmapManager statically imported org.forester.io.parsers.util.ParserUtils.createReader, a
    // convenience factory whose whole body is a File/InputStream/CharSequence switch over
    // BufferedReader constructors. Phase 8 inlined the two branches it used - the newick parsing itself
    // has always been libnewicktree's (net.sourceforge.olduvai), not forester's.
    implementation(group: "org.biojava", name: "biojava-genome", version: "7.2.6") {
        exclude group: "org.biojava.thirdparty", module: "forester"
    }

    // newick format
    implementation group: "com.github.qurben", name: "libnewicktree", version: "1.0"

    // igv
    implementation group: "com.github.igvteam", name: "igv", version: "v2.6.3"

    // sbgn format
    implementation group: "org.sbgn", name: "libsbgn", version: "0.2"

    //  BioPAX
    implementation group: "org.biopax.paxtools", name: "paxtools-core", version: "5.1.0"
    implementation group: "org.biopax.paxtools", name: "sbgn-converter", version: "5.0.0"
    implementation group: "pathwaycommons", name: "chilay-sbgn", version: "3.0.0"

    //LLM
    // 1.0.0-beta.2 (2023) until Phase 8, now 1.0.0-beta.16 - the latest, and still a beta: this
    // library has never had a GA release and the last one was published in March 2025, so the pin is
    // explicit rather than coming from the azure-sdk-bom above (which carries GA libraries only).
    // The bump has to happen with the storage one, not after it: beta.2 was built against azure-core
    // 1.40.0, and the BOM moves azure-core to 1.58.1 under it.
    // The API changed shape in beta.6: a chat request message went from one settable-role
    // ChatMessage class to a class per role, and NonAzureOpenAIKeyCredential (api.openai.com rather
    // than an Azure deployment) was folded into azure-core's KeyCredential. Both land in
    // manager/llm/OpenAIClient, which is the only file that touches this SDK. The second of the two
    // does change behaviour for llm.custom.type=openai - beta.2 ignored the configured URL, beta.16
    // honours it and switches to the api-key header - see the Phase 8 findings in
    // .devenv/JAVA21-MIGRATION-PLAN.md.
    implementation group: "com.azure", name: "azure-ai-openai", version: "1.0.0-beta.16"

    // gson carried an explicit `2.10.1` here until Phase 8. No Java file in either module imports
    // com.google.gson; it is only ever used through the two google-api artifacts below, which bring
    // it themselves. Worse than redundant: because io.spring.dependency-management resolves like
    // Maven, a version declared here beat both the BOM's managed 2.13.2 and what those artifacts
    // asked for, so the declaration was a downgrade.
    implementation group: 'com.google.apis', name: 'google-api-services-customsearch', version: 'v1-rev20240103-2.0.0'
    implementation group: 'com.google.http-client', name: 'google-http-client-jackson2', version: '1.44.1'

    //Excel
    // 3.16 (2017) until Phase 8. POI 4 removed Cell.getCellTypeEnum() - the interim name POI 3.15 gave
    // the typed getter while getCellType() still returned an int - and renamed it back to
    // getCellType(); those two call sites in TargetGeneManager were the only API break in NGB.
    // Transitives change more than the API does: poi-ooxml-schemas 3.16 + xmlbeans 2.6.0 (2011) give
    // way to poi-ooxml-lite 5.5.1 + xmlbeans 5.3.0, and commons-collections4 (see the pin above),
    // commons-compress, commons-codec, curvesapi, SparseBitSet and log4j-api come along.
    implementation group: "org.apache.poi", name: "poi", version: "5.5.1"
    implementation group: "org.apache.poi", name: "poi-ooxml", version: "5.5.1"

//    CSV
    // 5.8 (2023) until Phase 8. Only CSVReader and CsvValidationException are used, in
    // TargetGeneManager and the two classes that propagate its exception; neither changed. The bump
    // is for the transitives - opencsv is what puts commons-beanutils on the runtime classpath, and
    // 5.8 asks for 1.9.4, which CVE-2025-48734 covers; 5.12.0 asks for 1.11.0, which is the fix.
    implementation group: "com.opencsv", name: "opencsv", version: "5.12.0"

    // >>>>> dependencies used to compile tests; in fact no need to include them into artifact
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    // spring-boot-starter-test dropped JUnit 4 in Boot 2.2 in favour of JUnit 5; all 129 test
    // classes here are JUnit 4, so it comes back as an explicit dependency rather than through the
    // starter, and the vintage engine runs it on the JUnit 5 platform (see `test` above, and D13).
    testImplementation group: "junit", name: "junit", version: "4.13.2"
    testRuntimeOnly group: "org.junit.vintage", name: "junit-vintage-engine"
    // Declared rather than left to Gradle to inject: Gradle 8 still adds the launcher implicitly but
    // warns that it will stop doing so, and the version is BOM-managed either way.
    testRuntimeOnly group: "org.junit.platform", name: "junit-platform-launcher"
    testImplementation group: "org.unitils", name: "unitils-core", version: project.ext.versionUnitils
    // Was javax.servlet:javax.servlet-api:3.1.0. Same role - the tests that fake an HTTP request
    // (MultipartFileSender, UrlTestingUtils, BamManagerTest) compile against the servlet API
    // directly - under the name and version Boot 3.5 manages.
    testImplementation group: "jakarta.servlet", name: "jakarta.servlet-api"
    testImplementation group: "com.jayway.jsonpath", name: "json-path", version: project.ext.versionJayWayJsonPath
    testImplementation group: "com.jayway.jsonpath", name: "json-path-assert", version: project.ext.versionJayWayJsonPath
    // Jetty 12 (what the BOM manages) split the servlet API off into org.eclipse.jetty.ee10 and
    // deleted the AbstractHandler that these tests' file servers were written against. jetty-server
    // alone no longer knows what a servlet is, so the EE10 servlet module comes too and the two
    // handlers are now plain HttpServlets - see controller/util/UrlTestingUtils.
    testImplementation group: 'org.eclipse.jetty', name: 'jetty-server'
    testImplementation group: 'org.eclipse.jetty.ee10', name: 'jetty-ee10-servlet'
    testImplementation group: "org.springframework.security", name: "spring-security-test"

    // javax.transaction:jta:1.1 went out with EhCache 2, which was the only thing that wanted it
    // (net.sf.ehcache.transaction refers to javax.transaction.* and EhCache's CacheManager touches
    // those classes while parsing a configuration). Nothing else in the tree imports
    // javax.transaction, and Spring 6 is on jakarta.transaction.
}

// io.spring.dependency-management applies the Boot BOM to *every* configuration, including the one
// Gradle assembles to run PMD. PMD 7 needs commons-lang3 >= 3.13 for
// EnumUtils.getEnumMap(Class, Function), and a BOM pinning it lower kills pmdMain with a
// NoSuchMethodError before it reads a source file. The analyser's classpath is not the
// application's, so keep the app's managed version off it. A resolution rule rather than a `pmd`
// dependency declaration: the Pmd plugin adds the tool itself through defaultDependencies, which
// only fires while the configuration has no declared dependencies at all.
//
// As of the commons-lang3 3.17.0 -> 3.20.0 override above this rule is a no-op - the app's managed
// version is what the rule forces, and `dependencyInsight --configuration pmd` resolves 3.20.0 with
// the rule switched off. It stays as a floor for the analyser, which is a different requirement from
// the application's: the two numbers coincide today and do not have to, so this one is deliberately
// a literal and not a reference to ext['commons-lang3.version'].
configurations.pmd {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.apache.commons" && details.requested.name == "commons-lang3") {
            details.useVersion "3.20.0"
        }
    }
}

// >>>>> configuration for pmd plugin
pmd {
    toolVersion = "7.26.0"
    // ruleSetFiles does not replace ruleSets, it adds to it, and Gradle's default for ruleSets is
    // the entire category/java/errorprone.xml (it was the much narrower java-basic under Gradle 3).
    // Left at the default it contributes ~1690 violations from rules this project never asked for.
    ruleSets = []
    // One ruleset only. There used to be a second, pmd-ruleset-feature-index-manager.xml, which
    // re-declared the whole rule list with AvoidCatchingGenericException off and an include-pattern
    // for FeatureIndexManager.java and util/TestUtils.java. It could not have been doing that:
    // RuleSets.apply() runs the rule chain before it consults each ruleset's file patterns, and
    // nearly every PMD rule is rule-chain based, so the patterns were ignored and every shared rule
    // ran twice (116 reported violations for 58 actual ones). It is also no longer needed -
    // FeatureIndexManager only catches IOException now, and the one place that does still need the
    // exemption, util/TestUtils.assertFail, carries a @SuppressWarnings for that single rule. (Phase
    // 2 recorded that util/TestUtils.java was out of reach because it is under src/test; true of
    // pmdMain, but pmdTest scans it, and Phase 3 is where pmdTest was first run.)
    ruleSetFiles = files("config/pmd/pmd-ruleset.xml")
}

checkstyle {
    toolVersion = "11.1.0"
    // Gradle 4+ resolves the default config dir against the *root* project, which for this
    // multi-project build is the wrong place. Both modules keep their own copy.
    configDirectory = file("config/checkstyle")
}

def excludePattern = 'VgPb'
def excludePatternAntStyle = '**/' + excludePattern + '*'

tasks.withType(Checkstyle) {
    exclude excludePatternAntStyle
}
tasks.withType(Pmd) {
    exclude excludePatternAntStyle
}

def escape(String s) {
    return s.replace("\\", "\\\\")
}

// Packaging. Under Boot 1.5 `bootRepackage` rewrote the output of the plain `jar` task in place,
// so naming the `jar` task's archive was enough. Boot 2.x builds the executable jar in a separate
// `bootJar` task and leaves `jar` producing a thin `-plain.jar` alongside it — which the `zip`,
// `tar` and `bundle*` tasks below would happily pick up too, since they glob build/libs for
// `**/*.jar`. So name `bootJar` and turn the plain jar off.
bootJar {
    archiveFileName = "catgenome.jar"
}

jar {
    enabled = false
}

//Distributions
//distribution properties
def appName = 'ngb-server'
// Boot 3.2 relocated the loader classes into org.springframework.boot.loader.launch; the old name is
// not in the jar any more, so the generated ngb-server start scripts would fail with
// ClassNotFoundException. Only the zip/tar/bundle* distributions use this - none of them is wired
// into `assemble`, so nothing in .devenv builds them, but the name still has to be right.
def springBootlauncherClass = 'org.springframework.boot.loader.launch.JarLauncher'
def springBootJarName = 'catgenome.jar'
// --enable-native-access=ALL-UNNAMED suppresses three "restricted method in
// java.lang.foreign.Linker has been called" warnings per start: Lucene 9's MMapDirectory uses the
// FFM API. The manifest attribute that would make the flag unnecessary (Enable-Native-Access) is
// JDK 24+, so on 21 it has to be on the command line of every launcher.
def ngbJvmOptions = ["-Xms512m", "-Xmx2g", "--enable-native-access=ALL-UNNAMED"]

startScripts {
    applicationName = appName
    mainClass = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
}

task zip(type: Zip) {
    dependsOn bootJar, startScripts
    from('build/libs/') {
        include '**/*.jar'
        into('lib')
    }
    from('build/scripts') {
        into('bin')
    }
    archiveBaseName = appName
    archiveFileName = 'ngb-server.zip'
}

task tar(type: Tar) {
    dependsOn bootJar, startScripts
    from('build/libs/') {
        include '**/*.jar'
        into('lib')
    }
    from('build/scripts') {
        into('bin')
    }
    archiveBaseName = appName
    archiveFileName = 'ngb-server.tgz'
    archiveExtension = 'tgz'
    compression = Compression.GZIP
}

// ---------------------------------------------------------------------------------------------
// JRE-bundled distributions: the server plus a runtime, for machines with no Java installed.
//
// These downloaded a JRE 8 from http://download.oracle.com/otn-pub/java/jdk/8-b132/ with a
// `Cookie: oraclelicense=accept-securebackup-cookie` header. That URL is gone, the cookie trick
// stopped working in 2019, Oracle no longer ships a standalone JRE at all, and the licence it
// asserted acceptance of on the builder's behalf is not one to redistribute under. The replacement
// is Eclipse Temurin, pinned to an exact build and checked against Adoptium's own published
// SHA-256 - see the checksums below.
//
// jlink is the other option the plan suggested, and it is not used, for one reason: it cannot
// cross-target. `jlink` on a Linux JDK produces Linux runtime images only, so a Windows bundle
// would need a Windows build host and the two bundles could no longer be produced by one CI job.
// A prebuilt JRE is bigger (~45 MB compressed vs ~35 MB for a trimmed image) and keeps both
// bundles buildable anywhere.
//
// `-PbundleArch=aarch64` builds for aarch64 instead of x64. The published artifacts are x64; the
// switch exists so the Linux bundle can be unpacked and started on an aarch64 machine, which is
// how the exit criterion for this task was actually checked.
def bundleJreVersion = '21.0.12+8'
def bundleJreDir = "jdk-${bundleJreVersion}-jre"          // the archive's own top-level directory
def bundleArch = (project.findProperty('bundleArch') ?: 'x64').toString()
def bundleJreUrlBase = 'https://github.com/adoptium/temurin21-binaries/releases/download/' +
        "jdk-${bundleJreVersion.replace('+', '%2B')}/"
def bundleJreFile = { String os, String extension ->
    "OpenJDK21U-jre_${bundleArch}_${os}_hotspot_${bundleJreVersion.replace('+', '_')}.$extension"
}
// https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/<file>.sha256.txt
def bundleJreChecksums = [
        'OpenJDK21U-jre_x64_linux_hotspot_21.0.12_8.tar.gz':
                '8a379a67c91a3ae61ffb33d46e0a40c7ba35e70713c4db31cfca30492f792eff',
        'OpenJDK21U-jre_aarch64_linux_hotspot_21.0.12_8.tar.gz':
                '5f9c96b656827b9d14ebeda7739e25be554fa6d25669b03847c1df6e869c0679',
        'OpenJDK21U-jre_x64_windows_hotspot_21.0.12_8.zip':
                'b8aa18fef5edb69bee8618f99677d66d0873d22cb40d974c15ac9ffcdecf73ba',
        'OpenJDK21U-jre_aarch64_windows_hotspot_21.0.12_8.zip':
                'a50ed83b6a88d3127d406713f5057d78f845c3412d59e201dac6db37714af85c',
]
def windowsJre = bundleJreFile('windows', 'zip')
def linuxJre = bundleJreFile('linux', 'tar.gz')

def verifyJreChecksum = { File archive ->
    def expected = bundleJreChecksums[archive.name]
    if (expected == null) {
        throw new GradleException("No published SHA-256 on record for ${archive.name}. " +
                "-PbundleArch=$bundleArch is not one of the architectures listed in " +
                "bundleJreChecksums; add its checksum from Adoptium's .sha256.txt first.")
    }
    def actual = java.security.MessageDigest.getInstance('SHA-256')
            .digest(archive.bytes).encodeHex().toString()
    if (actual != expected) {
        throw new GradleException("Checksum mismatch on ${archive.name}:\n" +
                "  expected $expected\n  actual   $actual\n" +
                "Delete $archive and retry; if it keeps failing, the pinned build was re-published.")
    }
}

// The start-script templates are Gradle's, and pointing them at the bundled JRE means editing
// generated text. Do it loudly: a template change across a Gradle upgrade would otherwise leave a
// bundle that quietly falls back to whatever `java` is on the PATH - which on a machine with no
// system JDK, the whole point of these archives, is nothing at all.
def pointAtBundledJre = { File script, String from, String to ->
    def text = script.text
    if (!text.contains(from)) {
        throw new GradleException("Cannot point ${script.name} at the bundled JRE: Gradle's start " +
                "script template no longer contains [$from]. Update the substitution in " +
                "server/catgenome/build.gradle.")
    }
    script.text = text.replace(from, to)
}

// What both scripts get is JAVA_HOME, set before they look for a JVM - not a rewritten exec line at
// the bottom. The previous version substituted the exec line only, and both templates `die` on a
// missing java long before reaching it, so the Linux bundle failed with "JAVA_HOME is not set and no
// 'java' command could be found in your PATH" on exactly the machine it exists for. Setting JAVA_HOME
// instead also turns the template's own "JAVA_HOME is set to an invalid directory" check into a
// useful one: it now means the bundled jre/ directory is missing.
def bundledJavaHomeUnix = '''# The runtime this archive ships with, in place of a system JDK.
JAVA_HOME="$APP_HOME/jre"

# Determine the Java command to use to start the JVM.'''

// Both bundles unpack the JRE as `jre/` rather than as `jdk-21.0.12+8-jre/`, so the launchers do not
// have to be edited every time the pinned build moves - and so no path in the archive contains `+`.
def unpackedAsJre = { spec ->
    spec.eachFile { it.path = it.path.replaceFirst("^\\Q$bundleJreDir\\E/", 'jre/') }
    spec.includeEmptyDirs = false
}

//Windows Distribution
task customStartScriptsWin(type: CreateStartScripts) {
    applicationName = appName
    mainClass = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
    // Its own directory. This task and customStartScriptsLinux both emit `ngb-server` and
    // `ngb-server.bat`, and while they shared $buildDir/scripts whichever ran last overwrote the
    // other's substitutions - so a bundleWindows that ran after bundleLinux shipped a .bat still
    // looking for %JAVA_HOME%.
    outputDir = file("$buildDir/scripts-windows")
    doLast {
        pointAtBundledJre(windowsScript,
                'if defined JAVA_HOME goto findJavaFromJavaHome',
                'set JAVA_HOME=%APP_HOME%\\jre\r\nif defined JAVA_HOME goto findJavaFromJavaHome')
    }
}

task downloadJreWin(type: Download) {
    src bundleJreUrlBase + windowsJre
    dest "$buildDir/downloads/$windowsJre"
    overwrite false
    doLast {
        verifyJreChecksum(file("$buildDir/downloads/$windowsJre"))
    }
}

task bundleWindows(type: Zip) {
    dependsOn downloadJreWin
    dependsOn customStartScriptsWin, bootJar
    from(zipTree("$buildDir/downloads/$windowsJre")) {
        unpackedAsJre(it)
    }

    from("$buildDir/libs") {
        include '**/*.jar'
        into('lib')
    }

    // Only the .bat. CreateStartScripts also emits a POSIX script, and the old bundle shipped it
    // pointed at `jre1.8.0/bin/java` - a path that does not exist in a Windows JRE, where the
    // executable is java.exe. A launcher that cannot work is worse than an absent one.
    from("$buildDir/scripts-windows/${appName}.bat") {
        into('bin')
    }

    archiveBaseName = appName
    archiveFileName = 'ngb-server-windows.zip'
}

//Linux Distribution

task customStartScriptsLinux (type: CreateStartScripts) {
    applicationName = appName
    mainClass = springBootlauncherClass
    classpath = files(springBootJarName)
    defaultJvmOpts = ngbJvmOptions
    outputDir = file("$buildDir/scripts-linux")
    doLast {
        pointAtBundledJre(unixScript,
                '# Determine the Java command to use to start the JVM.',
                bundledJavaHomeUnix)
    }
}

task downloadJreLinux(type: Download) {
    src bundleJreUrlBase + linuxJre
    dest "$buildDir/downloads/$linuxJre"
    overwrite false
    doLast {
        verifyJreChecksum(file("$buildDir/downloads/$linuxJre"))
    }
}

task bundleLinux(type: Tar) {
    dependsOn downloadJreLinux
    dependsOn customStartScriptsLinux, bootJar
    from(tarTree(resources.gzip("$buildDir/downloads/$linuxJre"))) {
        unpackedAsJre(it)
    }

    from("$buildDir/libs") {
        include '**/*.jar'
        into('lib')
    }

    from("$buildDir/scripts-linux/$appName") {
        into('bin')
    }

    archiveBaseName = appName
    archiveFileName = 'ngb-server-linux.tgz'
    archiveExtension = 'tgz'
    compression = Compression.GZIP
}

distTar {
    enabled = false
}

distZip {
    enabled = false
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = false
    }
}
