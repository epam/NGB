server.servlet.context-path=/catgenome
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/xml,application/json,application/javascript
server.tomcat.connection-timeout=20000
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# static content caching
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
bed.multi.format.file.path=
feature.counts.extensions=.featureCounts.txt,.featureCounts
request.logging.filter.max.payload.length=64000
motif.search.sliding.window=1000
motif.search.buffer.size=16000000
motif.search.page.size=100
motif.search.include.sequence=false
motif.search.result.size.limit=131072
