server.servlet.context-path=/catgenome
# Boot 2.6 switched Spring MVC's default path matcher to PathPatternParser, which leaves
# RequestMappingInfo.getPatternsCondition() null. swagger-springmvc 1.0.2 dereferences it while
# scanning the request mappings and dies with an NPE, and AppMVCConfiguration's
# setUseSuffixPatternMatch(false) is an AntPathMatcher-only setting too. Stay on the old matcher;
# it goes away with the move to springdoc.
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
# Boot 2.6 also turned circular bean references from a warning into a startup failure. Every cycle
# in NGB's own code has been cut properly (see the @Lazy annotations and
# AclSecurityConfiguration.permissionEvaluator), but one cycle is not ours to fix:
# spring-security-saml2-core 1.0.10 annotates SAMLEntryPoint.setSamlDiscovery and
# SAMLDiscovery.setSamlEntryPoint with @Autowired(required=false) - two of its own classes wired to
# each other by design, and both directions are used at runtime (the entry point forwards to
# discovery when no IdP is determined, discovery returns to the entry point's processing URL).
# Suppressing either injection would change SAML behaviour, which is the one thing this waypoint
# must not do. Remove this line in Phase 3, which deletes the OpenSAML 2 stack outright.
spring.main.allow-circular-references=true
server.compression.enabled=true
server.compression.min-response-size=2048
server.compression.mime-types=text/html,text/xml,application/json,application/javascript
server.tomcat.connection-timeout=20000
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-response=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# static content caching
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
server.index.cache.enabled=true
bed.multi.format.file.path=
feature.counts.extensions=.featureCounts.txt,.featureCounts
request.logging.filter.max.payload.length=64000
motif.search.sliding.window=1000
motif.search.buffer.size=16000000
motif.search.page.size=100
motif.search.include.sequence=false
motif.search.result.size.limit=131072
