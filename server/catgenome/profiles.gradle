import org.apache.tools.ant.filters.ReplaceTokens

// Folds the selected profile's and database flavour's resources into the normal resource
// processing. This used to be a `copyConfiguration` task whose `doLast` wrote straight into
// build/resources — invisible to Gradle's up-to-date checking, and ordered only by an explicit
// `processResources.dependsOn`. Declaring the profile files as extra `from` specs of
// processResources/processTestResources gets the same layout with correct incremental builds.

processResources {
    doFirst {
        println "Target profile: $profile"
        println "Target database: $database"
        println "Build number: $buildNumber"
    }

    from("profiles/$profile") {
        filter(ReplaceTokens, tokens: project.filterTokens)
    }
    from("profiles/version.properties") {
        filter(ReplaceTokens, tokens: project.filterTokens)
    }
    // Deliberately unfiltered, as before: these two carry no @token@ placeholders.
    from("profiles/$database") {
        include "applicationContext*"
        into "conf/catgenome"
    }
    from("profiles/$database/dao") {
        include "dao-helper.xml"
        into "conf/catgenome/dao"
    }
}

processTestResources {
    from("profiles/$database") {
        include "test*"
    }
    filesNotMatching("**/templates/**") {  // To exclude binary files, because they are being broken by filtering
        filter(ReplaceTokens, tokens: project.filterTokens)
    }
}
