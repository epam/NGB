import org.gradle.internal.os.OperatingSystem

// The build used to apply `com.moowork.node` 1.1.1, which is not Gradle-7-compatible, and to
// download its own Node when the one on PATH was too old. Node is pinned below and installed by
// the environment (see .devenv/toolbox/Dockerfile), so these are plain Exec tasks
// against the `npm` on PATH. Task names are unchanged — the root build depends on `:client:buildUI`.

def clientPath = hasProperty("clientPath") ? clientPath : "/catgenome"
def nodeVersion = "14.17.5"
def npm = OperatingSystem.current().isWindows() ? "npm.cmd" : "npm"

checkNodeVersion(nodeVersion)

def checkNodeVersion(required) {
    def stdout = new ByteArrayOutputStream()
    def result
    try {
        result = exec {
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
            commandLine "node", "-v"
        }
    } catch (Exception e) {
        throw new GradleException("Node.js v$required is required to build the client, but " +
                "`node` is not on PATH. See .devenv/README.md for the build environment.", e)
    }
    if (result.exitValue != 0) {
        throw new GradleException("Node.js v$required is required to build the client, but " +
                "`node -v` failed. See .devenv/README.md for the build environment.")
    }
    def installed = stdout.toString().trim()
    if (installed.replaceFirst(/^v/, "").tokenize(".")[0] != required.tokenize(".")[0]) {
        logger.warn("WARNING: building the client with Node $installed; it is pinned to " +
                "v$required and the webpack 4 toolchain is not known to work on other majors.")
    }
}

task clean(type: Delete) {
    delete(project.buildDir)
}

task npmPrune(type: Exec) {
    commandLine npm, "prune"
}

task npmInstall(type: Exec) {
    dependsOn npmPrune
    commandLine npm, "install"
}

task buildUI(type: Exec) {
    dependsOn npmInstall
    environment "PUBLIC_URL", clientPath
    commandLine npm, "run", "build:prod"
}
