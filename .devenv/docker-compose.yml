# NGB containerised dev environment (see README.md).
#
# Profiles:
#   (default)  builder + certs + ngb-h2      -> build and run on H2
#   saml       + idp (Keycloak) + idp-metadata
#   pg         + postgres + ngb-pg + test-pg
#   cli        + ngb-cli container
#   cloud      + minio + minio-init          -> S3/SWS without AWS credentials
#
# Ports are deliberately identical inside and outside the containers, because SAML
# compares URLs byte-for-byte between the browser and the service provider.

name: ngb-dev

x-toolbox: &toolbox
  image: ngb-dev-toolbox:latest
  build:
    context: ./toolbox
    args:
      NODE_VERSION: "14.17.5"

x-build-volumes: &build-volumes
  - ../:/workspace
  - gradle-cache:/cache/gradle
  - npm-cache:/cache/npm
  - node-modules:/workspace/client/node_modules

services:

  # ---------------------------------------------------------------- builder --
  # Long-lived toolbox. All Gradle/npm/mkdocs work happens in here:
  #   docker-compose exec builder ./gradlew buildJar -PnoTest
  builder:
    <<: *toolbox
    container_name: ngb-builder
    working_dir: /workspace
    volumes: *build-volumes
    environment:
      GRADLE_USER_HOME: /cache/gradle
      npm_config_cache: /cache/npm
      TERM: xterm-256color
    command: ["sleep", "infinity"]
    networks: [ngb]

  # ------------------------------------------------------------------ certs --
  # One-shot: self-signed JKS (HTTPS + SAML signing key) and the RSA keypair NGB
  # uses to mint JWT tokens for the CLI. Idempotent - skips what already exists.
  certs:
    <<: *toolbox
    container_name: ngb-certs
    entrypoint: ["/bin/bash", "/scripts/gen-secrets.sh"]
    environment:
      KEYSTORE_PASS: ${KEYSTORE_PASS:-changeit}
      HTTPS_KEY_ALIAS: ${HTTPS_KEY_ALIAS:-ngb-https}
      SAML_SIGN_KEY: ${SAML_SIGN_KEY:-ngb-saml}
      SAN_HOSTS: ${SAN_HOSTS:-ngb.dev.local,ngb-pg.dev.local,localhost}
    volumes:
      - ./certs:/scripts:ro
      - ./secrets:/secrets
    networks: [ngb]

  # ------------------------------------------------------------------ ngb-h2 --
  ngb-h2:
    <<: *toolbox
    container_name: ngb-h2
    depends_on:
      certs:
        condition: service_completed_successfully
    environment:
      AUTH_MODE: ${AUTH_MODE:-none}
      JAVA_VERSION: ${NGB_JAVA_VERSION:-21}  # 21 only - the jar is Java 21 bytecode
      JAVA_EXTRA_OPTS: ${JAVA_EXTRA_OPTS:-}
      NGB_HEAP: ${NGB_HEAP:-2g}
      NGB_JAR: /dist/catgenome-h2.jar
      NGB_HOSTNAME: ngb.dev.local
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      DB_DRIVER: org.h2.Driver
      DB_URL: jdbc:h2:file:/opt/ngb/H2/catgenome
      DB_USER: catgenome
      DB_PASSWORD: ""
      DEFAULT_ADMIN: ${DEFAULT_ADMIN:-ngbadmin@ngb.dev.local}
      KEYSTORE_PASS: ${KEYSTORE_PASS:-changeit}
      HTTPS_KEY_ALIAS: ${HTTPS_KEY_ALIAS:-ngb-https}
      SAML_SIGN_KEY: ${SAML_SIGN_KEY:-ngb-saml}
      CATGENOME_CONF_DIR: /opt/ngb/config
    entrypoint: ["/bin/bash", "/opt/ngb/bin/entrypoint.sh"]
    volumes:
      - ./ngb:/opt/ngb/bin:ro
      - ../dist:/dist:ro
      - ./secrets:/secrets:ro
      - ./data/ngs:/ngs
      - ngb-h2-contents:/opt/ngb/contents
      - ngb-h2-db:/opt/ngb/H2
    ports:
      - "8080:8080"
      - "8443:8443"
    networks:
      ngb:
        aliases: [ngb.dev.local]

  # ------------------------------------------------------------------ ngb-pg --
  # Same jar family, PostgreSQL flavour (built with -Pdatabase=postgres).
  ngb-pg:
    <<: *toolbox
    container_name: ngb-pg
    profiles: [pg]
    depends_on:
      certs:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AUTH_MODE: ${AUTH_MODE:-none}
      JAVA_VERSION: ${NGB_JAVA_VERSION:-21}  # 21 only - the jar is Java 21 bytecode
      JAVA_EXTRA_OPTS: ${JAVA_EXTRA_OPTS:-}
      NGB_HEAP: ${NGB_HEAP:-2g}
      NGB_JAR: /dist/catgenome-psql.jar
      NGB_HOSTNAME: ngb-pg.dev.local
      HTTP_PORT: "8090"
      HTTPS_PORT: "8493"
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/ngb
      DB_USER: catgenome
      DB_PASSWORD: catgenome
      DB_WAIT_HOST: postgres
      DEFAULT_ADMIN: ${DEFAULT_ADMIN:-ngbadmin@ngb.dev.local}
      KEYSTORE_PASS: ${KEYSTORE_PASS:-changeit}
      HTTPS_KEY_ALIAS: ${HTTPS_KEY_ALIAS:-ngb-https}
      SAML_SIGN_KEY: ${SAML_SIGN_KEY:-ngb-saml}
      CATGENOME_CONF_DIR: /opt/ngb/config
    entrypoint: ["/bin/bash", "/opt/ngb/bin/entrypoint.sh"]
    volumes:
      - ./ngb:/opt/ngb/bin:ro
      - ../dist:/dist:ro
      - ./secrets:/secrets:ro
      - ./data/ngs:/ngs
      - ngb-pg-contents:/opt/ngb/contents
    ports:
      - "8090:8090"
      - "8493:8493"
    networks:
      ngb:
        aliases: [ngb-pg.dev.local]

  # ---------------------------------------------------------------- postgres --
  # 16 is the version NGB is built and tested against; the fallback below matches PG_VERSION in
  # .env.example so that an unset variable does not silently give a different server.
  # Changing PG_VERSION needs `make reset-pg`: a data directory written by one major version is
  # unreadable by the next, and reset-pg destroys the cluster rather than migrating it.
  postgres:
    image: postgres:${PG_VERSION:-16}
    container_name: ngb-postgres
    profiles: [pg]
    environment:
      POSTGRES_USER: catgenome
      POSTGRES_PASSWORD: catgenome
      POSTGRES_DB: ngb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catgenome -d ngb"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ngb]

  # ----------------------------------------------------------------- test-pg --
  # The PostgreSQL test profile hardcodes localhost:5432/ngb_test, so this runs in
  # the database's own network namespace instead of patching the properties file.
  test-pg:
    <<: *toolbox
    container_name: ngb-test-pg
    profiles: [pg]
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    working_dir: /workspace
    volumes: *build-volumes
    environment:
      GRADLE_USER_HOME: /cache/gradle
      npm_config_cache: /cache/npm
    command:
      # No `with-java21` prefix: JDK 21 is the image default.
      - "./gradlew"
      - "-p"
      - "server/catgenome"
      - "test"
      - "-Pdatabase=postgres"

  # ------------------------------------------------------------------- minio --
  # An S3-compatible object store, so that NGB's s3:// and sws:// read paths can be exercised
  # on a machine with no AWS account. Both are endpoint-overridable: `sws://` through
  # swift.stack.endpoint.url, and the plain `s3://` client through AWS SDK v2's
  # AWS_ENDPOINT_URL_S3 / -Daws.endpointUrlS3 (v1 had no such switch). See `make up-cloud`.
  #
  # MINIO_DOMAIN is the load-bearing setting here. SDK v2 has no system property or environment
  # variable for forcing path-style addressing - only S3Configuration.pathStyleAccessEnabled in
  # code, which NGB sets for the swift-stack client and not for the S3 one - so the s3:// client
  # asks for http://<bucket>.<endpoint host>. MINIO_DOMAIN makes MinIO read the bucket out of the
  # Host header, and the aliases below make those hosts resolve. Both addressing styles are then
  # served at once, which is what NGB needs: path-style for sws://, virtual-host for s3://.
  #
  # This service used to need an s3.amazonaws.com alias, with `make up-cloud` pointing NGB at that
  # name rather than at `minio`, because one NGB code path keyed off the hostname:
  # EnhancedUrlHelper decided whether to tolerate a 403 on HEAD by matching the host against
  # `.*s3.*\.amazonaws\.com`, and a pre-signed URL is signed for GET only - so under the honest name
  # the pre-signed read path read every object as empty. That tolerance is keyed to the URL's own
  # SigV4 signature now, the alias is gone, and `make verify-cloud` reading a track through a
  # pre-signed http://<bucket>.minio:9000/... URL is what proves it. (verify-tracks.sh still hijacks
  # the name for its own staged-403 probe, on a container of its own - that exercises the
  # amazonaws.com clause EnhancedUrlHelper deliberately keeps, and it would collide with an alias
  # here.)
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ngb-minio
    profiles: [cloud]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ngbminio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-ngbminio-secret}
      MINIO_DOMAIN: minio
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      ngb:
        aliases:
          - minio
          # Quoted and on its own line: `${...}` inside a YAML flow sequence reads as the start of a
          # flow mapping and the file stops parsing.
          - "${MINIO_BUCKET:-ngb-cloud}.minio"

  # -------------------------------------------------------------- minio-init --
  # One-shot: create the bucket and upload the fixtures the cloud checks read. Only the four
  # files verify-cloud.sh compares against a local read are copied, not the whole of /ngs -
  # this is a fixture loader, not a backup. Idempotent (`mb --ignore-existing`, `cp` overwrites).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ngb-minio-init
    profiles: [cloud]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_USER: ${MINIO_USER:-ngbminio}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-ngbminio-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-ngb-cloud}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set ngb "http://minio:9000" "$$MINIO_USER" "$$MINIO_PASSWORD" > /dev/null
        mc mb --ignore-existing "ngb/$$MINIO_BUCKET"
        for f in CantonS.vcf.gz CantonS.vcf.gz.tbi \
                 agnX1.09-28.trim.dm606.realign.bam agnX1.09-28.trim.dm606.realign.bam.bai; do
          if [ -f "/ngs/tracks/$$f" ]; then
            mc cp "/ngs/tracks/$$f" "ngb/$$MINIO_BUCKET/tracks/$$f"
          else
            echo "missing /ngs/tracks/$$f - run scripts/prepare-track-fixtures.sh first" >&2
            exit 1
          fi
        done
        mc ls -r "ngb/$$MINIO_BUCKET"
    volumes:
      - ./data/ngs:/ngs:ro
    networks: [ngb]

  # --------------------------------------------------------------------- idp --
  # Keycloak as SAML 2.0 IdP. KC_HTTP_PORT matches the published port so the SAML
  # URLs are identical from the browser and from inside the network.
  idp:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.0}
    container_name: ngb-idp
    profiles: [saml]
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://idp.dev.local:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    volumes:
      - ./keycloak/realm-ngb.json:/opt/keycloak/data/import/realm-ngb.json:ro
    # No volume for /opt/keycloak/data/h2 on purpose: Keycloak runs as uid 1000 and
    # cannot write a root-owned named volume. start-dev recreates its H2 database and
    # re-imports the realm on every start, so the IdP is always reproducible - but any
    # change made in the admin console by hand is lost on restart. Edit realm-ngb.json
    # instead if you need it to stick.
    ports:
      - "8081:8081"
    networks:
      ngb:
        aliases: [idp.dev.local]

  # ------------------------------------------------------------ idp-metadata --
  # NGB reads IdP metadata from a *file* (server.ssl.metadata, resolved as a plain
  # filesystem path), so the descriptor is pulled from Keycloak into the shared
  # secrets directory.
  idp-metadata:
    <<: *toolbox
    container_name: ngb-idp-metadata
    profiles: [saml]
    depends_on: [idp]
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        url="http://idp.dev.local:8081/realms/ngb/protocol/saml/descriptor"
        echo "Waiting for Keycloak realm descriptor at $$url ..."
        for i in $$(seq 1 60); do
          if curl -fsS "$$url" -o /secrets/idp-metadata.xml.tmp \
             && grep -q "EntityDescriptor" /secrets/idp-metadata.xml.tmp; then
            mv /secrets/idp-metadata.xml.tmp /secrets/idp-metadata.xml
            echo "IdP metadata written to /secrets/idp-metadata.xml"
            exit 0
          fi
          sleep 3
        done
        echo "ERROR: could not fetch IdP metadata from $$url" >&2
        exit 1
    volumes:
      - ./secrets:/secrets
    networks: [ngb]

  # --------------------------------------------------------------------- cli --
  # ngb-cli for data registration and the e2e CLI test suite.
  cli:
    <<: *toolbox
    container_name: ngb-cli
    profiles: [cli]
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/opt/cli/entrypoint.sh"]
    command: ["sleep", "infinity"]
    environment:
      GRADLE_USER_HOME: /cache/gradle
      npm_config_cache: /cache/npm
      # 17 by default: the CLI is built by a JDK 17 toolchain, where only the server module is on
      # 21. Deliberately not NGB_JAVA_VERSION - that one selects the JDK the *server* jar runs on,
      # and which JDK the CLI needs is decided by how the CLI was compiled, not by the server.
      JAVA_VERSION: ${CLI_JAVA_VERSION:-17}
      NGB_SERVER_URL: ${CLI_SERVER_URL:-http://ngb.dev.local:8080/catgenome}
      NGB_TOKEN: ${CLI_TOKEN:-}
    volumes:
      - ../:/workspace
      - ./cli:/opt/cli:ro
      - ../dist:/dist:ro
      - ./data/ngs:/ngs
      - gradle-cache:/cache/gradle
      - npm-cache:/cache/npm
    networks: [ngb]

networks:
  ngb:
    name: ngb-dev

volumes:
  gradle-cache:
  npm-cache:
  node-modules:
  ngb-h2-contents:
  ngb-h2-db:
  ngb-pg-contents:
  pg-data:
  minio-data:
