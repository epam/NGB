# --add-opens is for Gradle's own JVM, not the build's.
#
# Gradle's PMD and Checkstyle tasks run the tool through DefaultIsolatedAntBuilder, whose
# constructor reflects into java.util.prefs.AbstractPreferences to clean up the Groovy system it
# loaded. On JDK 16+ that is an InaccessibleObjectException, and the task fails before it looks at
# a single source file:
#
#   Could not create service of type IsolatedAntBuilder ...
#     Could not inspect the Groovy system for ClassLoader VisitableURLClassLoader(ant-and-gradle-loader)
#       Unable to make field private java.util.prefs.PreferenceChangeListener[]
#       java.util.prefs.AbstractPreferences.prefListeners accessible
#
# Gradle 7.6 does not put this flag in its own default daemon arguments (later versions do), so it
# has to be declared here - i.e. every checkstyle/pmd run on JDK 17 needs it, not just ours in
# .devenv. Re-check whether it is still necessary when the wrapper moves to Gradle 8.14 in Phase 3.
#
# Declaring org.gradle.jvmargs at all replaces Gradle's defaults, hence the heap settings: they are
# Gradle 7.6's own values (512m/384m), with the heap raised because this build is large.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED

# The Java 17 toolchain the modules declare must come from the environment (the .devenv toolbox
# installs 8, 17 and 21), never be downloaded. Without this, Gradle 7.6 warns that toolchain
# auto-provisioning is enabled with no toolchain repository declared - deprecated, and in Gradle 8
# the built-in provisioning repository is gone, so a build with no matching local JDK fails there
# instead of quietly fetching one. Saying so explicitly turns "no JDK 17 installed" into an
# immediate, clear error on both versions.
org.gradle.java.installations.auto-download=false
