
group "com.epam"

def uiFilesDestination = "$rootDir/server/catgenome/src/main/resources/static"
def serverBuilds = "$rootDir/server/catgenome/build/libs"
def cliBuilds = "$rootDir/server/ngb-cli/build/distributions"
def templateDestination = "$rootDir/server/catgenome/src/main/resources/export/target"
def templateBuilds = "$rootDir/export-templates/target-identification/template"
def distDir = "$rootDir/dist"
def dockerDir = "$rootDir/docker/core"
def runTests = !hasProperty("noTest")
def database = hasProperty("database") ? database : "h2"
def buildNumber = hasProperty("buildNumber") ? buildNumber : ""
def profile = hasProperty("profile") ? profile : "release"

allprojects {
    // 3.0.0, not 2.8.1: the Java 21 migration replaced the whole stack under this tree - JDK 8 to
    // 21, Spring Boot 1.5 to 3.5, javax to jakarta, Flyway 3 to 11, H2 1.3 to 2.3, Lucene 6 to 9,
    // htsjdk 2 to 5, AWS SDK v1 to v2, OpenSAML 2 to 4 - and two of those are breaking for whoever
    // is running NGB: an existing H2 or PostgreSQL database needs the documented upgrade
    // (docs/md/installation/database-upgrade.md) and every Lucene index has to be rebuilt
    // (docs/md/installation/lucene-reindex.md). 2.8.0 was cut but never released; its release notes
    // are kept as their own page and the feature they describe ships here.
    version = new Version(major: 3, minor: 0, patch: 0, build: buildNumber)
    task printVersion {
        doFirst {
            println "Project version is $version"
        }
    }
}

class Version {
    int major, minor, patch
    String build

    String toString() {
        "$major.$minor.$patch${build ? ".$build" : ''}"
    }
}

wrapper {
    gradleVersion = '8.14.5'
}

task ui(type: Copy) {
    dependsOn ':client:buildUI'
    doFirst {
        delete fileTree(uiFilesDestination) {
            // 'swagger-ui/**' used to be here to protect the committed Swagger 1.x UI in
            // src/main/resources/static from this delete. springdoc serves its own UI out of a jar
            // from Phase 3 on, and that directory is deleted, so there is nothing left to preserve.
            exclude ('blast**', 'tblast**', 'docs/**', 'miew/**')
        }
    }
    from "$rootDir/client/dist"
    into uiFilesDestination

    doLast {
        copy {
            from "$rootDir/server/catgenome/src/main/resources/templates"
            into uiFilesDestination
        }
    }
}

task templates() {
    dependsOn ':export-templates:target-identification:buildTemplate'
    doFirst {
        delete fileTree(templateDestination)
    }
    doLast {
        copy {
            from templateBuilds
            into templateDestination
        }
    }
}

task runMkdocs(type: Exec) {
    doFirst {
        delete fileTree("$rootDir/docs/site")
        delete fileTree(dir: "$rootDir/docs", include: '**/ngb_docs_*')
    }
    commandLine "mkdocs", "build"
    workingDir = "$rootDir/docs"
}

task buildDoc(type: Tar) {
    dependsOn runMkdocs
    from("$rootDir/docs/site") {
    }
    archiveFileName = "ngb-docs.tar.gz"
    destinationDirectory = file(distDir)
    compression = Compression.GZIP
}

task buildDocs(dependsOn: buildDoc) {
    doFirst {
        delete fileTree("$uiFilesDestination/docs")
    }
    doLast {
        copy {
            from tarTree("$distDir/ngb-docs.tar.gz")
            into "$uiFilesDestination/docs"
        }
    }
}

// The three GradleBuild tasks below used to set buildFile alongside dir, which named the same file
// dir already implies. Gradle 8 deprecates GradleBuild.buildFile and tells you to use dir; removing
// it leaves the nested builds' task graphs byte-for-byte identical (checked on buildCli).
task buildJar(type: GradleBuild) {
    dependsOn ui, templates, buildDocs
    if (runTests) {
        tasks = ['clean', 'build']
    } else {
        tasks = ['clean', 'bootJar']
    }
    startParameter.projectProperties = [profile    : 'jar',
                                        database   : database,
                                        buildNumber: buildNumber]
    dir = "$rootDir/server/catgenome"
    doLast {
        copy {
            from "$serverBuilds/catgenome.jar"
            into distDir
        }
    }
}

task buildCli(type: GradleBuild) {
    if (runTests) {
        tasks = ['clean', 'build']
    } else {
        tasks = ['clean', 'assemble']
    }
    dir = "$rootDir/server/ngb-cli"
    doLast {
        copy {
            from "$cliBuilds/ngb-cli.tar.gz"
            into distDir
        }
    }
}

apply from: "e2e/cli/cli-tests.gradle"
task integrationCliTest() {
    doLast {e2eCliTests()}
}

task buildDocker(type: Exec) {
    dependsOn buildJar, buildCli
    doFirst {
        delete file("$dockerDir/ngb-cli.tar.gz")
        delete file("$dockerDir/catgenome.jar")
        copy {
            from "$distDir/catgenome.jar"
            into dockerDir
        }
        copy {
            from "$distDir/ngb-cli.tar.gz"
            into dockerDir
        }
    }
    commandLine "docker", "build", "-t", "ngb:latest", "."
    workingDir = "$rootDir/docker/core"
    doLast {
        delete file("$dockerDir/ngb-cli.tar.gz")
        delete file("$dockerDir/catgenome.jar")
    }
}

task buildDockerDemo(type: Exec) {
    dependsOn buildDocker
    commandLine "docker", "build", "-t", "ngb:latest-demo", "."
    workingDir = "$rootDir/docker/demo"
}

task buildAll(type: GradleBuild) {
    tasks = ['buildCli', 'buildJar', 'buildDocs', 'buildDocker']
    dir = "$rootDir"
    if (runTests) {
        startParameter.projectProperties = [database   : database,
                                            buildNumber: buildNumber]
    } else {
        startParameter.projectProperties = [database   : database,
                                            buildNumber: buildNumber,
                                            noTest: '']
    }
}
